<script>
// Picket wall generation & animation
(function(){
  const front = document.getElementById('picketFront');
  const back = document.getElementById('picketBack');
  const wall = document.getElementById('picketWall');
  if(!front || !back || !wall) return;

  const barCount = 48; // 48 pickets per layer
  const staggerBase = 30; // ms

  function createBars(container, isFront){
    const frag = document.createDocumentFragment();
    for(let i=0;i<barCount;i++){
      const bar = document.createElement('div');
      bar.className = 'picket-bar';
      const xPct = (i/(barCount-1))*100;
      bar.style.left = xPct + '%';
      // varied heights: base 60-100% with gentle variance
      const h = 60 + Math.sin(i*0.7)*15 + Math.cos(i*1.3)*10;
      bar.style.height = h + '%';
      // stagger delay
      bar.style.transitionDelay = (i*staggerBase) + 'ms';
      frag.appendChild(bar);
    }
    container.appendChild(frag);
  }

  createBars(front, true);
  createBars(back, false);

  // Rise animation on load
  requestAnimationFrame(()=>{
    document.querySelectorAll('.picket-bar').forEach(bar=>{
      bar.style.transform = 'translateZ(0) scaleY(1)';
    });
  });

  // Pointer parallax (damped)
  let targetRY = -8, targetRX = 4;
  let currentRY = -8, currentRX = 4;
  let rafId = null;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function lerp(a,b,t){ return a + (b-a)*t; }
  function animate(){
    if(prefersReduced) return;
    currentRY = lerp(currentRY, targetRY, 0.08);
    currentRX = lerp(currentRX, targetRX, 0.08);
    wall.style.transform = `rotateY(${currentRY}deg) rotateX(${currentRX}deg)`;
    rafId = requestAnimationFrame(animate);
  }
  animate();

  // Idle sway
  let swayPhase = 0;
  function idleSway(){
    if(prefersReduced) return;
    swayPhase += 0.00052; // ~12s cycle
    const swayY = Math.sin(swayPhase)*0.6;
    const swayX = Math.cos(swayPhase*0.7)*0.4;
    targetRY = -8 + swayY;
    targetRX = 4 + swayX;
  }
  setInterval(idleSway, 100);

  // Mouse parallax
  let bounds = null;
  function updateBounds(){ bounds = wall.getBoundingClientRect(); }
  updateBounds();
  window.addEventListener('resize', updateBounds);
  window.addEventListener('scroll', updateBounds);

  document.addEventListener('mousemove', e=>{
    if(prefersReduced || !bounds) return;
    const cx = bounds.left + bounds.width/2;
    const cy = bounds.top + bounds.height/2;
    const dx = (e.clientX - cx) / (bounds.width/2);
    const dy = (e.clientY - cy) / (bounds.height/2);
    targetRY = -8 + dx * 3; // ±3deg
    targetRX = 4 - dy * 2;  // ±2deg
  });

  // Pause when offscreen
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        if(!rafId) animate();
      }else{
        if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
      }
    });
  },{rootMargin:'100px'});
  observer.observe(wall);
})();

// Reveal system (html.js-gated + JS safety net)
(function(){
  // html.js-gated: .rv starts hidden, .rv.on shows
  // JS safety net: after ~1100ms, add .on to ALL .rv
  const rv = document.querySelectorAll('.rv');
  rv.forEach(el=>el.classList.add('on'));
  // Also add .js to html for the gated reveal (if not already)
  document.documentElement.classList.add('js');
})();

// Quote form handling (basic)
(function(){
  const form = document.getElementById('quoteForm');
  if(!form) return;
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    const orig = btn.textContent;
    btn.textContent = 'Sending…';
    btn.disabled = true;
    try{
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(Object.fromEntries(data))
      });
      if(res.ok){
        btn.textContent = 'Request sent';
        setTimeout(()=>{btn.textContent=orig;btn.disabled=false;form.reset()},3000);
      }else{
        btn.textContent = 'Try again';
        setTimeout(()=>{btn.textContent=orig;btn.disabled=false},3000);
      }
    }catch{
      btn.textContent = 'Try again';
      setTimeout(()=>{btn.textContent=orig;btn.disabled=false},3000);
    }
  });
})();
</script>
</body>
</html>
