  <path d="M148 148 L156 148 L156 164 L148 164 Z" fill="#303030"/>
  <path d="M188 148 L196 148 L196 164 L188 164 Z" fill="#303030"/>
  
  <!-- Trowel/roller suggestion - filled shapes (no strokes) -->
