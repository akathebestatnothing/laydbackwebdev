<svg id="logo" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <title>Seal Fix logo</title>
  <!-- Membrane lap corner: floor-wall junction with rolled waterproof membrane -->
  <!-- All paths are filled shapes (no strokes) for predictable scaling -->
  <!-- Centered and scaled to fill canvas better -->
  
  <!-- Floor slab -->
  <path d="M32 180 L224 180 L224 192 L32 192 Z" fill="#6b6f96"/>
  
  <!-- Wall -->
  <path d="M32 32 L44 32 L44 180 L32 180 Z" fill="#6b6f96"/>
  
  <!-- Membrane on floor (horizontal band) -->
  <path d="M32 148 L224 148 L224 164 L32 164 Z" fill="#6b6f96"/>
  
  <!-- Membrane up wall (vertical lap) -->
  <path d="M32 60 L44 60 L44 148 L32 148 Z" fill="#6b6f96"/>
  
  <!-- Bond breaker fillet at corner (rounded inside corner) -->
  <path d="M44 148 Q44 112 80 112 L80 100 Q44 100 44 148 Z" fill="#6b6f96"/>
  
  <!-- Taped seam lines on membrane (thin filled rectangles) -->
  <path d="M68 148 L76 148 L76 164 L68 164 Z" fill="#303030"/>
