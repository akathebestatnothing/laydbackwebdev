<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Savi Developments — Property Development, Hunter NSW</title>
<meta name="description" content="Property development across the Hunter region — residential and multi-dwelling projects."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;600;700&family=Mulish:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{ /* lbq-contrast */ --bg:#24262b;--line:rgba(244,242,236,.16);--accent:#ff4d9d;
  --field:#24262b;
  --panel:#2b2e34;
  --text:#eceae4;
  --chalk:#f4f2ec;
  --hivis:#ff4d9d;
  --muted:#9aa0a8;
  --hair:rgba(244,242,236,.14);
  --radius:4px;
  --max:1200px;
}
*, *::before, *::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
body{
  margin:0;
  font-family:'Mulish',system-ui,sans-serif;
  background:var(--field);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--hivis);outline-offset:2px;border-radius:2px}
.rv{opacity:1;transform:none;transition:opacity .6s ease,transform .6s ease}
.js .rv{opacity:0;transform:translateY(16px)}
.js .rv.on{opacity:1;transform:none}
.skip-link{
  position:absolute;top:-100%;left:16px;z-index:1000;
  padding:8px 12px;background:var(--hivis);color:#000;font-weight:600;border-radius:var(--radius);
}
.skip-link:focus{top:16px}

/* NAV */
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;background:rgba(36,38,43,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--hair);
}
.nav-wordmark{
  display:flex;align-items:center;gap:10px;
  font-family:'Host Grotesk',sans-serif;font-weight:700;font-size:clamp(1.1rem,2.5vw,1.35rem);
  letter-spacing:-.02em;color:var(--chalk);
}
.nav-peg{
  width:8px;height:8px;background:var(--hivis);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.nav-links{
  display:flex;gap:8px;list-style:none;margin:0;padding:0;
}
.nav-links a{
  font-family:'Host Grotesk',sans-serif;font-weight:500;font-size:.85rem;
  letter-spacing:.02em;color:var(--muted);
  padding:6px 10px;border-radius:var(--radius);
  transition:color .2s,background .2s;
}
.nav-links a:hover,.nav-links a:focus{
  color:var(--chalk);background:var(--panel);
}
@media (max-width:760px){
  .nav-links{display:none}
}

/* HERO */
.hero{
  position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:0 24px 120px;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0,rgba(255,77,157,.06),transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 100%,rgba(255,77,157,.04),transparent 50%);
  pointer-events:none;
}
.hero-canvas{
  position:absolute;inset:0;z-index:0;pointer-events:none;
}
.hero-content{
  position:relative;z-index:1;max-width:var(--max);margin:0 auto;width:100%;
}
.hero-eyebrow{
  font-family:'Fira Code',monospace;font-weight:400;font-size:.75rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--hivis);margin:0 0 16px;
}
.hero h1{
  font-family:'Host Grotesk',sans-serif;font-weight:700;font-size:clamp(2.5rem,6vw,4.5rem);
  line-height:1.05;letter-spacing:-.03em;color:var(--chalk);margin:0 0 16px;
}
.hero-sub{
  font-size:clamp(1rem,2vw,1.15rem);color:var(--muted);max-width:560px;margin:0 0 32px;
}
.hero-cta{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Host Grotesk',sans-serif;font-weight:600;font-size:.95rem;
  padding:14px 28px;border-radius:var(--radius);
  border:1px solid transparent;cursor:pointer;
  transition:transform .15s,box-shadow .2s,background .2s,color .2s;
}
.btn:active{transform:scale(.98)}
.btn-primary{
  background:var(--chalk);color:var(--field);
}
.btn-primary:hover,.btn-primary:focus{
  box-shadow:0 0 0 3px var(--hivis);
}
.btn-tel{
  color:var(--chalk);font-family:'Host Grotesk',sans-serif;font-weight:500;font-size:.95rem;
  padding:14px 8px;
}
.btn-tel:hover,.btn-tel:focus{color:var(--hivis)}

/* SCOPE TAGS (01) */
.scope{
  padding:80px 24px;background:var(--panel);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
.section-inner{max-width:var(--max);margin:0 auto}
.section-tag{
  font-family:'Fira Code',monospace;font-weight:400;font-size:.7rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--hivis);margin:0 0 12px;
}
.section-title{
  font-family:'Host Grotesk',sans-serif;font-weight:700;font-size:clamp(1.75rem,4vw,2.5rem);
  line-height:1.15;letter-spacing:-.02em;color:var(--chalk);margin:0 0 8px;
}
.section-sub{color:var(--muted);margin:0 0 40px;max-width:560px}
.tags-row{
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
}
.tag{
  position:relative;display:inline-flex;align-items:center;
  font-family:'Host Grotesk',sans-serif;font-weight:500;font-size:.9rem;
  padding:12px 20px 12px 16px;background:var(--field);
  border:1px solid var(--hair);border-radius:var(--radius);
  clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
  transition:border-color .2s,background .2s,transform .15s;
}
.tag:hover,.tag:focus-within{
  border-color:var(--hivis);background:var(--panel);transform:translateY(-2px);
}
.tag::after{
  content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:0;height:0;border:9px solid transparent;border-left-color:var(--field);
  pointer-events:none;
}
@media (max-width:560px){
  .tags-row{gap:8px}
  .tag{font-size:.8rem;padding:10px 16px 10px 12px}
  .tag::after{border-width:7px}
}

/* STATIONS (02) */
.stations{
  padding:100px 24px;background:var(--field);
}
.stations-inner{max-width:var(--max);margin:0 auto;position:relative}
.stations-path{
  position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,var(--hair) 20%,var(--hair) 80%,transparent);
  z-index:0;
}
.station{
  position:relative;display:flex;gap:24px;align-items:flex-start;
  padding:24px 0;z-index:1;
}
.station:nth-child(odd){
  flex-direction:row-reverse;padding-left:calc(50% + 32px);
}
.station:nth-child(even){
  padding-right:calc(50% + 32px);
}
.station-peg{
  position:absolute;left:50%;top:36px;transform:translateX(-50%);
  width:14px;height:14px;background:var(--field);
  border:2px solid var(--hivis);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  z-index:2;
}
.station-peg::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:4px;height:4px;background:var(--hivis);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
}
.station-num{
  font-family:'Fira Code',monospace;font-weight:500;font-size:.75rem;
  color:var(--hivis);white-space:nowrap;
}
.station-content{flex:1;min-width:280px}
.station h3{
  font-family:'Host Grotesk',sans-serif;font-weight:600;font-size:1.1rem;
  color:var(--chalk);margin:0 0 6px;
}
.station p{color:var(--muted);margin:0;font-size:.95rem}
@media (max-width:760px){
  .stations-path{display:none}
  .station{flex-direction:column !important;padding:16px 0 !important;align-items:center;text-align:center}
  .station-peg{left:50% !important;top:0 !important;transform:translateX(-50%)}
  .station-num{margin-bottom:8px}
  .station-content{width:100%;max-width:480px}
}

/* STATEMENT BAND */
.statement{
  padding:80px 24px;background:var(--panel);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
.statement-inner{max-width:var(--max);margin:0 auto;text-align:center}
.statement-frame{
  position:relative;padding:48px 24px;
  border:1px dashed var(--hair);border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,77,157,.02),transparent);
}
.statement-frame::before,.statement-frame::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:24px;height:1px;background:var(--hivis);
}
.statement-frame::before{top:-1px}
.statement-frame::after{bottom:-1px}
.statement-frame h2{
  font-family:'Host Grotesk',sans-serif;font-weight:700;font-size:clamp(1.5rem,3.5vw,2.25rem);
  line-height:1.2;letter-spacing:-.02em;color:var(--chalk);margin:0 0 12px;
}
.statement-frame p{color:var(--muted);margin:0;font-size:1.05rem}

/* QUOTE SECTION (03) - injected */
.quote{
  padding:100px 24px;background:var(--field);
}
.quote-inner{max-width:var(--max);margin:0 auto}
.quote h2{
  font-family:'Host Grotesk',sans-serif;font-weight:700;font-size:clamp(1.75rem,4vw,2.5rem);
  line-height:1.15;letter-spacing:-.02em;color:var(--chalk);margin:0 0 8px;
}
.quote-sub{color:var(--muted);margin:0 0 32px;max-width:560px}

/* FOOTER */
.footer{
  padding:48px 24px;background:var(--panel);
  border-top:1px solid var(--hair);
}
.footer-inner{max-width:var(--max);margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
.footer-legal{
  font-family:'Host Grotesk',sans-serif;font-weight:600;font-size:.95rem;color:var(--chalk);
}
.footer-location{color:var(--muted);font-size:.9rem}
.footer-contact{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.footer-tel{font-family:'Host Grotesk',sans-serif;font-weight:500;font-size:.95rem;color:var(--chalk)}
.footer-tel:hover,.footer-tel:focus{color:var(--hivis)}
.footer-ig{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.85rem;color:var(--muted);padding:6px 10px;border:1px solid var(--hair);border-radius:var(--radius);
  transition:color .2s,border-color .2s;
}
.footer-ig:hover,.footer-ig:focus{color:var(--hivis);border-color:var(--hivis)}
.footer-copy{width:100%;color:var(--muted);font-size:.8rem;margin-top:24px;padding-top:24px;border-top:1px solid var(--hair)}
@media (max-width:560px){
  .footer-inner{flex-direction:column;align-items:flex-start}
}

/* STRINGS SVG BACKGROUND (global subtle lines) */
.strings-bg{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.6;
}
.string-line{
  stroke:var(--hivis);stroke-width:.5;stroke-dasharray:8 6;fill:none;opacity:.35;
}
.string-peg{
  fill:var(--hivis);
}
.chalk-mark{
  stroke:var(--chalk);stroke-width:.4;stroke-linecap:round;opacity:.15;
}
</style>
</head>
<body>
