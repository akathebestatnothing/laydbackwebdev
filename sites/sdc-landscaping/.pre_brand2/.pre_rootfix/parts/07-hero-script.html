<script>
// String-line hero canvas — groundwork-sage family (REBUILT 2026-10-04: world-space projection fix)
// rAF-first-frame law: requestAnimationFrame(draw) — never call draw() directly (except reduced-motion static frame WITH timestamp)
// isFinite guards on all computed coordinates
// Reduced-motion: single static frame drawn after canvas is sized; no rAF loop scheduled
// Pointer sentinel guarded (mouseX > -100) + mouseleave reset (handlers kept; drawing does not depend on pointer)
// CSS governs layout; JS sets only canvas.width/height (never canvas.style.width/height)

(() => {
  const canvas = document.getElementById('hero-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let rafId = 0;
  let mouseX = -9999;
  let mouseY = -9999;
  let width = 0;
  let height = 0;
  let dpr = 1;
  let startTime = 0;

  const lineCount = 6;
  const nearZ = 12;
  const spreadZ = 33;          // lines/stakes live at z = 12 .. 45
  const camH = 1.35;
  const stakes = [];           // two per line (left/right edge posts)
  const lines = [];            // one string per z

  // Adaptive horizon: lower on small screens so the string fan sits below the hero copy.
  function horizonY() { return height * (width < 700 ? 0.87 : 0.84); }

  function project(x, z) {
    const f = Math.max(1, height * 1.15);
    const zc = Math.max(0.9, z);
    const s = f / zc;
    return { x: width / 2 + x * s, y: horizonY() + camH * f / zc, s: s };
  }

  function initStakes() {
    stakes.length = 0;
    lines.length = 0;
    const f = Math.max(1, height * 1.15);
    const spreadX = (width * 0.34) * nearZ / f;  // world half-width: near line spans ~±34% of canvas

    for (let i = 0; i < lineCount; i++) {
      const t = i / (lineCount - 1);
      const z = nearZ + t * spreadZ;
      const line = {
        z: z,
        tension: 0.5 + Math.random() * 0.3,
        sag: 0.02 + Math.random() * 0.03,
        color: i === 0 ? 'rgba(108,133,120,0.8)' : i === lineCount - 1 ? 'rgba(185,107,69,0.75)' : 'rgba(43,47,45,0.5)',
        glowColor: i === 0 ? 'rgba(108,133,120,0.95)' : i === lineCount - 1 ? 'rgba(185,107,69,0.9)' : null,
        glow: i === 0 || i === lineCount - 1
      };
      lines.push(line);

      for (let s2 = -1; s2 <= 1; s2 += 2) {
        stakes.push({
          x: s2 * spreadX,
          z: z,
          sway: (Math.random() - 0.5) * 0.16,      // world units
          swaySpeed: 0.0004 + Math.random() * 0.0005,
          swayPhase: Math.random() * Math.PI * 2,
          h: 0.42 + Math.random() * 0.14           // world height
        });
      }
    }
  }

  function drawStake(st, t) {
    const sway = Math.sin(t * st.swaySpeed + st.swayPhase) * st.sway;
    const base = project(st.x + sway, st.z);
    if (!isFinite(base.x) || !isFinite(base.y)) return;
    const hpx = Math.max(10, st.h * base.s);
    ctx.beginPath();
    ctx.moveTo(base.x, base.y);
    ctx.lineTo(base.x, base.y - hpx);
    ctx.strokeStyle = 'rgba(43,47,45,0.6)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(base.x, base.y - hpx, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(185,107,69,0.85)';
    ctx.fill();
  }

  function drawLine(line, t) {
    const f = Math.max(1, height * 1.15);
    const spreadX = (width * 0.34) * nearZ / f;
    const segments = 24;
    const swayAmt = Math.sin(t * 0.0008) * 0.32 * (1 - line.tension * 0.7);  // world units

    ctx.beginPath();
    for (let i = 0; i <= segments; i++) {
      const u = i / segments;
      const x = -spreadX + u * spreadX * 2;
      const sway = Math.sin(u * Math.PI) * swayAmt * (0.5 + u * 0.5);
      const pt = project(x + sway, line.z);
      const sag = Math.sin(u * Math.PI) * line.sag * height * 0.8;
      const yy = pt.y + sag;
      if (!isFinite(pt.x) || !isFinite(yy)) return;
      if (i === 0) ctx.moveTo(pt.x, yy);
      else ctx.lineTo(pt.x, yy);
    }
    ctx.strokeStyle = line.color;
    ctx.lineWidth = line.glow ? 3 : 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Bright edge line for the glow strings (first + last)
    if (line.glow && line.glowColor) {
      ctx.beginPath();
      for (let i = 0; i <= segments; i++) {
        const u = i / segments;
        const x = -spreadX + u * spreadX * 2;
        const sway = Math.sin(u * Math.PI) * swayAmt * (0.5 + u * 0.5);
        const pt = project(x + sway, line.z);
        const sag = Math.sin(u * Math.PI) * line.sag * height * 0.8;
        const yy = pt.y + sag - 1.5;
        if (!isFinite(pt.x) || !isFinite(yy)) return;
        if (i === 0) ctx.moveTo(pt.x, yy);
        else ctx.lineTo(pt.x, yy);
      }
      ctx.strokeStyle = line.glowColor;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function drawBubbleLevel(t) {
    // The "settle to level" moment: a spirit level resting on the nearest string line.
    const near = project(0, nearZ);
    const sagMid = lines[0] ? lines[0].sag * height * 0.8 : 0;
    const y = near.y + sagMid - 6;
    const x = width / 2 + Math.sin(t * 0.0008) * 10;
    const bob = Math.sin(t * 0.0012) * 5;

    ctx.beginPath();
    ctx.roundRect(x - 28, y - 5.5, 56, 11, 5.5);
    ctx.fillStyle = 'rgba(247,246,242,0.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(43,47,45,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x + bob, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(108,133,120,0.85)';
    ctx.fill();
  }

  function draw(t) {
    if (!isFinite(t)) return;
    if (!startTime) startTime = t;
    const elapsed = t - startTime;

    ctx.clearRect(0, 0, width, height);

    // Ground plane hint below the horizon
    const horizon = horizonY();
    const grad = ctx.createLinearGradient(0, horizon, 0, height);
    grad.addColorStop(0, 'rgba(108,133,120,0.06)');
    grad.addColorStop(1, 'rgba(43,47,45,0.03)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, horizon, width, height - horizon);

    for (const line of lines) drawLine(line, elapsed);
    for (const st of stakes) drawStake(st, elapsed);
    drawBubbleLevel(elapsed);

    if (!prefersReduced) rafId = requestAnimationFrame(draw);
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.floor(rect.width * dpr);
    height = Math.floor(rect.height * dpr);
    canvas.width = width;
    canvas.height = height;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // reset + scale (no compounding across resizes)
    initStakes();

    if (prefersReduced) {
      draw(performance.now());   // single static frame, sized first
    }
  }

  function onPointerMove(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
  }

  function onPointerLeave() {
    mouseX = -9999;
    mouseY = -9999;
  }

  function start() {
    if (prefersReduced) {
      resize();
      return;
    }
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerleave', onPointerLeave);
    window.addEventListener('resize', resize);
    resize();
    rafId = requestAnimationFrame(draw);   // rAF-first-frame
  }

  function stop() {
    cancelAnimationFrame(rafId);
    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerleave', onPointerLeave);
    window.removeEventListener('resize', resize);
  }

  // Start when ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else {
    start();
  }

  // Cleanup on unload
  window.addEventListener('beforeunload', stop, { once: true });
})();
</script>
