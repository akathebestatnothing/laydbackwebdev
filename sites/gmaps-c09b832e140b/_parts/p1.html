<style>
:root{
--bg:#eaece2;--panel:#ffffff;--ink:#131f18;--pine:#2c5c3f;--copper:#b0653a;--moss:#7d8a6f;
--mossink:#4a5c46;--line:rgba(19,31,24,.14);--hair:#cfd4c6;--accent:#2c5c3f;
--disp:"Sofia Sans",system-ui,sans-serif;--body:"Encode Sans",system-ui,sans-serif;--mono:"Overpass Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{display:block}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(18px,4vw,56px)}
.lbl{font:500 11.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mossink)}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#f1f4ec;padding:10px 16px;z-index:80}
.skip:focus{left:12px;top:12px}
@media(min-width:900px){body{font-size:18px}}
.topbar{position:sticky;top:0;z-index:50;background:rgba(234,236,226,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:21px;height:21px;flex:none}
.wm b{display:block;font:800 14.5px/1 var(--disp);letter-spacing:-.01em}
.wm span{display:block;font:500 8px/1 var(--mono);letter-spacing:.24em;color:var(--mossink);margin-top:3px}
.navlinks{display:flex;align-items:center;gap:20px}
.navlinks a{font:500 11.5px/1 var(--mono);letter-spacing:.05em;text-decoration:none;transition:color .18s ease}
.navlinks a:hover{color:var(--pine)}
.navlinks .call{color:var(--pine);border-bottom:1px solid transparent;transition:border-color .18s ease,color .18s ease}
.navlinks .call:hover{border-color:var(--copper);color:var(--copper)}
.mobcta{display:none;gap:8px}
.mobcta a{font:600 12px/1 var(--body);text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:2px}
.mobcta a.q{background:var(--pine);color:#f1f4ec;border-color:var(--pine)}
@media(max-width:760px){.navlinks{display:none}.mobcta{display:flex}}
.hero{position:relative;min-height:620px;height:min(116vh,1100px);display:flex;align-items:flex-end;overflow:hidden}
#hero{position:absolute;inset:0;display:block}
.hero .wrap{position:relative;z-index:2;width:100%;padding-bottom:clamp(26px,5vh,58px)}
.hero-copy{max-width:840px}
.hero-copy .lbl{margin:0 0 14px}
.hero-copy h1{font:900 clamp(2.7rem,6vw,4.9rem)/1.02 var(--disp);letter-spacing:-.025em;margin:0 0 18px}
.hero-copy .sub{font:400 clamp(1rem,1.3vw,1.18rem)/1.6 var(--body);color:#243a2c;max-width:54ch;margin:0 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 16px}
.btn{display:inline-flex;align-items:center;font:600 14px/1 var(--body);padding:14px 22px;border-radius:2px;text-decoration:none;transition:background .18s ease,color .18s ease,border-color .18s ease}
.btn.pine{background:var(--pine);color:#f1f4ec}
.btn.pine:hover{background:var(--ink)}
.btn.line{border:1px solid var(--line);color:var(--ink)}
.btn.line:hover{border-color:var(--copper);color:var(--pine)}
.hero-copy .micro{font:500 11px/1 var(--mono);letter-spacing:.18em;color:var(--mossink)}
@media(max-width:640px){.hero{min-height:900px;height:900px}}
