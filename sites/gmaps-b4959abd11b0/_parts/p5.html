<script>
(function(){
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rev=[].slice.call(document.querySelectorAll('.rv'));
  if('IntersectionObserver' in window && !rm){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target);}});},{threshold:.14,rootMargin:'0px 0px -6% 0px'});
    rev.forEach(function(e){io.observe(e);});
  } else { rev.forEach(function(e){e.classList.add('on');}); }
  setTimeout(function(){document.querySelectorAll('.rv').forEach(function(e){e.classList.add('on');});},1100);
  var ids=['top','buildup','scope','areas','lbq'];
  var secs=ids.map(function(id){return document.getElementById(id);});
  var dots=[].slice.call(document.querySelectorAll('.elev a'));
  function spy(){
    var act=0;
    secs.forEach(function(s,i){ if(s && s.getBoundingClientRect().top<window.innerHeight*0.42) act=i; });
    dots.forEach(function(d,i){ d.classList.toggle('on', i===act); });
  }
  window.addEventListener('scroll',spy,{passive:true}); spy();
})();
</script>
<script>
(function(){
  var cv=document.getElementById('hero');
  if(!cv||!cv.getContext) return;
  var ctx=cv.getContext('2d');
  var W=0,H=0,DPR=1,geo={u:40,ox:0,oy:0,ks:1};
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mx=-100,my=-100,cpx=0,cpy=0,t0=null,settled=false,GA=1;
  var C30=Math.cos(Math.PI/6),S30=Math.sin(Math.PI/6);
  var NX=3,NY=1,NZ=3;
  var PAD=[[-1.4,-1.4],[4.4,-1.4],[4.4,2.4],[-1.4,2.4]];
  var GROUND=[0,0.35],ROOF=[2.06,2.30],DAT=[2.30,2.60],PUL=[2.60,2.98],TOTAL=2.98;
  function POST(i){return [0.32+0.38*i,0.68+0.38*i];}
  function FLOOR(i){return [0.80+0.38*i,1.30+0.38*i];}
  function size(){
    var r=cv.getBoundingClientRect();
    W=r.width||cv.clientWidth; H=r.height||cv.clientHeight;
    if(!W||!H) return false;
    DPR=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    return true;
  }
  function layout(){
    var mob=W<=820;
    var u=mob?Math.min(W*0.075,H*0.10):Math.min(H*0.135,W*0.105);
    var ks=mob?0.82:1;
    var cx=mob?W*0.60:W*0.665;
    var cy=mob?H*0.90:H*0.5;
    geo={u:u,ks:ks,ox:cx-0.866*u*ks,oy:cy+0.5*u*ks,mob:mob};
  }
  function P(x,y,z){
    var s=geo.u*geo.ks;
    return [geo.ox+(x-y)*C30*s, geo.oy+(x+y)*S30*s-z*s];
  }
  function isf(n){return typeof n==='number'&&isFinite(n);}
  function seg(a,b,col,wd,al){
    if(!a||!b||!isf(a[0])||!isf(a[1])||!isf(b[0])||!isf(b[1])) return;
    ctx.globalAlpha=(isf(al)?al:1)*GA; ctx.strokeStyle=col; ctx.lineWidth=wd||1;
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.globalAlpha=1;
  }
  function poly(pts,fillAl,strokeAl,strokeW){
    var ok=true,i;
    for(i=0;i<pts.length;i++){ if(!pts[i]||!isf(pts[i][0])||!isf(pts[i][1])){ok=false;break;} }
    if(!ok) return;
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.closePath();
    if(fillAl){ctx.globalAlpha=fillAl; ctx.fillStyle='#e8ecef'; ctx.fill();}
    if(strokeAl){ctx.globalAlpha=strokeAl*GA; ctx.strokeStyle='#e8ecef'; ctx.lineWidth=strokeW||1; ctx.stroke();}
    ctx.globalAlpha=1;
  }
  function easeOutBack(x){ var c1=0.55,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); }
  function prog(t,a,b){ if(t<=a) return 0; if(t>=b) return 1; return (t-a)/(b-a); }
  function lerpPt(a,b,f){ return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]; }
  function platePts(z,dy){
    return [ [P(0,0,z)[0],P(0,0,z)[1]+dy],[P(NX,0,z)[0],P(NX,0,z)[1]+dy],
             [P(NX,NY,z)[0],P(NX,NY,z)[1]+dy],[P(0,NY,z)[0],P(0,NY,z)[1]+dy] ];
  }
  function draw(t){
    if(!W||!H) return;
    GA=geo.mob?1:1;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(cpx,cpy);
    var gx,gy,x,y,i;
    poly([P(PAD[0][0],PAD[0][1],0),P(PAD[1][0],PAD[1][1],0),P(PAD[2][0],PAD[2][1],0),P(PAD[3][0],PAD[3][1],0)],0.05,0,1);
    var gp=prog(t,GROUND[0],GROUND[1]);
    if(gp>0.5){
      for(gx=-0.5;gx<3.9;gx+=0.5){ seg(P(gx,PAD[0][1],0),P(gx,PAD[2][1],0),'#e8ecef',1,0.08); }
      for(gy=-0.5;gy<1.9;gy+=0.5){ seg(P(PAD[0][0],gy,0),P(PAD[2][0],gy,0),'#e8ecef',1,0.08); }
    }
    var gA=P(0,0,0),gB=P(NX,0,0);
    if(gp>0){ seg(gA,lerpPt(gA,gB,gp),'#e8ecef',1.5,0.9); }
    if(gp>0.4){ seg(P(NX,0,0),P(NX,NY,0),'#e8ecef',1,0.5); seg(P(NX,NY,0),P(0,NY,0),'#e8ecef',1,0.5); }
    if(gp>0.15){ [1,2].forEach(function(xi){ var a=P(xi,0,0); seg([a[0],a[1]],[a[0],a[1]+6],'#e8ecef',1,0.5); }); }
    for(i=0;i<NZ;i++){
      var pp=prog(t,POST(i)[0],POST(i)[1]);
      if(pp>0){ for(x=0;x<=NX;x++){ for(y=0;y<=NY;y++){ seg(P(x,y,i),P(x,y,i+pp),'#e8ecef',1.15,0.9); } } }
      if(i<NZ-1){
        var fp=prog(t,FLOOR(i)[0],FLOOR(i)[1]);
        if(fp>0){
          var e=easeOutBack(fp), dy=-18*(1-e), al=0.4+0.6*fp;
          poly(platePts(i+1,dy),0.07*al,0.95*al,1.2);
        }
      }
    }
    var rp=prog(t,ROOF[0],ROOF[1]);
    if(rp>0){
      var rA=[P(0,0,NZ)[0],P(0,0,NZ)[1]], rB=[P(NX,0,NZ)[0],P(NX,0,NZ)[1]];
      seg(rA,lerpPt(rA,rB,rp),'#e8ecef',1.6,0.95);
      if(rp>0.5){ poly(platePts(NZ,0),0.06,0.7,1.2); }
    }
    var dp=prog(t,DAT[0],DAT[1]);
    if(dp>0){
      var dA=[P(0,0,NZ)[0],P(0,0,NZ)[1]], dB=[P(NX,0,NZ)[0],P(NX,0,NZ)[1]];
      seg(lerpPt(dA,dB,Math.max(0,dp-0.05)),lerpPt(dA,dB,dp),'#e5484d',2.2,1);
    }
    var up=prog(t,PUL[0],PUL[1]);
    if(up>0){
      var zt=NZ*up, pa=P(NX,0,zt), pb=P(NX,0,Math.max(0,zt-0.5));
      seg(pb,pa,'#e5484d',2.2,1);
      if(zt<NZ){ var dd=P(NX,0,zt); ctx.globalAlpha=GA; ctx.fillStyle='#e5484d'; ctx.fillRect(dd[0]-2.5,dd[1]-2.5,5,5); ctx.globalAlpha=1; }
    }
    ctx.restore();
  }
  function frame(ts){
    if(t0===null) t0=ts;
    var t=settled?TOTAL:Math.min((ts-t0)/1000,TOTAL);
    var tx=0,ty=0;
    if(mx>-100&&my>-100){ tx=((mx-W/2)/(W/2))*6; ty=((my-H/2)/(H/2))*4; }
    if(!isf(tx)) tx=0;
    if(!isf(ty)) ty=0;
    cpx+=(tx-cpx)*0.06; cpy+=(ty-cpy)*0.06;
    draw(t);
    if(!rm) requestAnimationFrame(frame);
  }
  window.__heroSettle=function(){ settled=true; cpx=0; cpy=0; draw(TOTAL); };
  function boot(){
    if(!size()) return;
    layout();
    if(rm){ draw(TOTAL); return; }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',function(){ if(size()){ layout(); if(rm) draw(TOTAL); } },{passive:true});
  window.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; },{passive:true});
  window.addEventListener('mouseout',function(e){ if(!e.relatedTarget){ mx=-100; my=-100; } },{passive:true});
  boot();
})();
</script>
</body>
</html>
