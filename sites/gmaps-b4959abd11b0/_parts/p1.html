<!doctype html>
<html lang="en-AU" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LBH Constructions | Builder &amp; Carpentry, Coffs Harbour NSW</title>
<meta name="description" content="LBH Constructions: building and carpentry across Coffs Harbour and the Mid North Coast, NSW. Request a quote.">
<meta name="theme-color" content="#161a1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@600;700&family=Anek+Latin:wght@400;500;600&family=B612+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.png" type="image/png">
<script>window.__BIZ={"business":"LBH Constructions"};</script>
<style>
:root{--bg:#161a1d;--panel:#1e2428;--ink:#e8ecef;--sub:#98a6ad;--red:#e5484d;--line:rgba(232,236,239,.14);--hair:#2a3136;--deep:#111417;--accent:#e5484d;--wt:1160px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Anek Latin',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.62}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:'Aleo',Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.015em;margin:0}
h3{font-weight:600}
p{margin:0}
.wrap{width:100%;max-width:var(--wt);margin:0 auto;padding:0 28px}
.lbl{font-family:'B612 Mono',ui-monospace,'Courier New',monospace;font-size:.71rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
.mono{font-family:'B612 Mono',ui-monospace,monospace}
.skip{position:absolute;left:-9999px;top:0;background:var(--panel);color:var(--ink);padding:10px 14px;z-index:60}
.skip:focus{left:8px;top:8px}
.topmark{position:sticky;top:0;z-index:40;background:rgba(22,26,29,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.topmark .wrap{display:flex;align-items:center;justify-content:space-between;height:46px}
.brand{display:flex;align-items:center;gap:9px;line-height:1}
.brand .bmark{width:26px;height:26px;flex:0 0 auto}
.brand .bword{display:flex;flex-direction:column;line-height:1}
.brand .wordmark{font-family:'Aleo',Georgia,serif;font-weight:700;font-size:1.04rem;letter-spacing:.03em}
.brand .wordsub{font-family:'B612 Mono',ui-monospace,monospace;font-size:.5rem;letter-spacing:.32em;color:var(--sub);margin-top:4px}
.sitenav{display:flex;align-items:center;gap:22px}
.sitenav a{font-family:'B612 Mono',ui-monospace,monospace;font-size:.73rem;letter-spacing:.06em;color:var(--sub);padding:5px 0;border-bottom:1px solid transparent;transition:color .18s ease,border-color .18s ease}
.sitenav a:hover{color:var(--ink);border-bottom-color:var(--red)}
.sitenav .navcall{color:var(--ink)}
.mobcta{display:none;gap:8px}
.mobcta a{font-family:'B612 Mono',ui-monospace,monospace;font-size:.71rem;letter-spacing:.05em;padding:7px 11px;border:1px solid var(--line);border-radius:2px;transition:border-color .18s ease}
.mobcta a.p{background:var(--red);color:#12161a;border-color:var(--red)}
.mobcta a:hover{border-color:var(--ink)}
@media(max-width:880px){.sitenav{display:none}.mobcta{display:flex}}
.elev{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:35;width:34px;padding:6px 0}
.elev::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:1px;background:var(--line)}
.elev a{position:relative;display:flex;align-items:center;justify-content:flex-end;height:36px;padding-right:5px;font-family:'B612 Mono',ui-monospace,monospace;font-size:.58rem;letter-spacing:.05em;color:var(--sub);transition:color .2s ease}
.elev a .tk{position:absolute;left:11px;width:8px;height:1px;background:var(--sub);transition:width .2s ease,background .2s ease}
.elev a.on{color:var(--ink)}
.elev a.on .tk{width:17px;background:var(--red)}
.elev a:hover{color:var(--ink)}
@media(max-width:900px){.elev{display:none}}
.hero{position:relative;min-height:640px;border-bottom:1px solid var(--line);overflow:hidden}
#hero{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .wrap{position:relative;z-index:2}
.hero-copy{max-width:500px;padding:98px 0 60px}
.hero-copy h1{font-size:clamp(2.4rem,5.2vw,4.4rem);line-height:1.03;letter-spacing:-.02em;margin-top:18px}
.hero-copy .lede{margin-top:22px;max-width:42ch;color:var(--sub)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{font-family:'B612 Mono',ui-monospace,monospace;font-size:.77rem;letter-spacing:.06em;padding:14px 22px;border:1px solid var(--line);border-radius:2px;transition:background .18s ease,border-color .18s ease,color .18s ease}
.btn-p{background:var(--red);color:#12161a;border-color:var(--red)}
.btn-p:hover{background:#ef5459}
.btn-o:hover{border-color:var(--ink)}
@media(max-width:820px){.hero{min-height:600px}.hero-copy{max-width:100%;padding:52px 0 16px}.hero-copy h1{font-size:1.95rem}.hero-copy .lede{font-size:.95rem;margin-top:14px}.hero-cta{margin-top:18px}}
