<!DOCTYPE html>
<html lang="en-AU" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Asphalt Man — Asphalt &amp; Bitumen Paving, Wyong NSW</title>
<meta name="description" content="Asphalt and bitumen paving across the Central Coast, NSW. Based in Wyong — call The Asphalt Man on __PHONE_DISPLAY__.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314171a'/%3E%3Crect x='22' y='6' width='4' height='20' fill='%23f2a516'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@500;600;700&family=Reddit+Sans:wght@400;500;600&family=Kode+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');</script>
<style>
:root{ /* lbq-contrast */
  --bg:#efeae0; --line:rgba(26,28,30,.18); --accent:#f2a516;
  --field:#efeae0; --panel:#e5dfd2; --ink:#1a1c1e; --muted:#5c5952;
  --asphalt:#14171a; --amber:#f2a516; --hairline:rgba(26,28,30,.16);
  --mono:'Kode Mono',ui-monospace,monospace;
  --disp:'Big Shoulders Text','Arial Narrow',sans-serif;
  --body:'Reddit Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--body);
  background:var(--field); color:var(--ink);
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.js .rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:1;transform:none;transition:none}
}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
img{max-width:100%;height:auto;display:block}
/* ---------- nav ---------- */
.nav{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,4vw,40px);
  background:var(--field);
  border-bottom:1px solid var(--hairline);
  position:sticky;top:0;z-index:100;
}
.nav__word{
  font-family:var(--disp);font-weight:700;font-size:1.25rem;letter-spacing:.06em;
  text-transform:uppercase;line-height:1;
}
.nav__word span{color:var(--amber)}
.nav__links{display:flex;gap:26px;font-family:var(--mono);font-size:.72rem;
  text-transform:uppercase;letter-spacing:.1em}
.nav__links a{opacity:.72}
.nav__links a:hover{opacity:1}
.nav__tel{font-family:var(--mono);font-size:.78rem;letter-spacing:.02em;white-space:nowrap}
.nav__tel a{border-bottom:1px solid var(--amber);padding-bottom:2px}
@media (max-width:820px){.nav__links{display:none !important}}
/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  min-height:76vh;display:flex;align-items:center;
  padding:clamp(48px,9vh,110px) clamp(16px,4vw,40px);
  border-bottom:1px solid var(--hairline);
}
.hero__canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero__inner{position:relative;z-index:1;max-width:900px}
.hero__eyebrow{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:12px;
}
.hero__eyebrow::before{content:"";width:34px;height:3px;background:var(--amber);display:inline-block}
.hero__title{
  font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(3.4rem,10vw,7rem);line-height:.92;letter-spacing:.005em;
  margin-bottom:22px;
}
.hero__title em{font-style:normal;-webkit-text-stroke:2px var(--ink);color:transparent}
.hero__sub{
  font-size:clamp(1rem,1.6vw,1.2rem);color:var(--muted);max-width:560px;margin-bottom:34px;
}
.hero__cta{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 30px;font-family:var(--disp);font-weight:600;font-size:1.02rem;
  letter-spacing:.04em;text-transform:uppercase;
  background:var(--asphalt);color:var(--field);border:1px solid var(--asphalt);
  transition:background .2s,color .2s,border-color .2s;cursor:pointer;
}
.btn:hover{background:var(--amber);border-color:var(--amber);color:var(--asphalt);text-decoration:none}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:var(--field)}
.hero__meta{
  position:absolute;right:clamp(16px,4vw,40px);top:30px;z-index:1;
  font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);writing-mode:vertical-rl;
}
@media (max-width:820px){.hero__meta{display:none}}
/* ---------- screed strip ---------- */
.screed{
  background:var(--asphalt);color:var(--field);
  padding:18px clamp(16px,4vw,40px);
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  border-top:3px solid var(--amber);
}
.screed__words{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:#c9c2b2;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.screed__words b{color:var(--amber);font-weight:400}
.screed__tel{font-family:var(--mono);font-size:.8rem;letter-spacing:.04em}
.screed__tel a{color:var(--field);border-bottom:1px solid var(--amber);padding-bottom:2px}
.screed__tel a:hover{color:var(--amber)}
/* ---------- runsheet ---------- */
.runsheet{padding:clamp(56px,9vh,96px) clamp(16px,4vw,40px);border-bottom:1px solid var(--hairline)}
.runsheet__head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  flex-wrap:wrap;margin-bottom:34px}
.runsheet__head h2{
  font-family:var(--disp);font-weight:600;text-transform:uppercase;
  font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:.02em;line-height:1;
}
.runsheet__head p{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.row{
  display:flex;align-items:baseline;gap:clamp(14px,3vw,36px);
  padding:20px 0;border-top:1px solid var(--hairline);flex-wrap:wrap;
}
.row:last-of-type{border-bottom:1px solid var(--hairline)}
.row__no{font-family:var(--mono);font-size:.78rem;color:var(--amber);min-width:34px}
.row__name{font-family:var(--disp);font-weight:600;font-size:clamp(1.3rem,2.6vw,1.7rem);
  text-transform:uppercase;letter-spacing:.02em;min-width:220px;flex:0 1 auto}
.row__desc{color:var(--muted);font-size:.98rem;flex:1 1 300px;min-width:0}
@media (max-width:640px){
  .row{flex-direction:column;gap:6px}
  .row__name{min-width:0}
}
