<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" id="logo">
  <title>Cheap Cheap Roof Restoration logo</title>
  <!-- Course Stack Roof Mark -->
  <!-- Tiled roof plane in three-quarter view with ridge cap, lifted tile, batten, downpipe collar -->
  
  <!-- Main roof plane (three-quarter perspective) - snapped to 30° angles -->
  <path d="M16 144 L128 48 L240 144 L248 156 L136 232 L8 156 Z" fill="#101418"/>
  
  <!-- Ridge cap -->
  <path d="M128 48 L128 96" stroke="#b2452f" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Course rows (tiles) - climbing to ridge -->
  <path d="M32 152 L224 152" stroke="#262c33" stroke-width="2"/>
  <path d="M40 164 L216 164" stroke="#262c33" stroke-width="2"/>
  <path d="M48 176 L208 176" stroke="#262c33" stroke-width="2"/>
  <path d="M56 188 L200 188" stroke="#262c33" stroke-width="2"/>
  <path d="M64 200 L192 200" stroke="#262c33" stroke-width="2"/>
  
  <!-- Lifted tile showing batten beneath -->
  <path d="M96 176 L160 176 L156 168 L92 168 Z" fill="#191d22" stroke="#262c33" stroke-width="1.5"/>
  
  <!-- Batten line beneath lifted tile -->
  <path d="M100 180 L156 180" stroke="#b2452f" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 4"/>
  
  <!-- Downpipe collar at eave -->
  <circle cx="184" cy="216" r="12" fill="#191d22" stroke="#262c33" stroke-width="2"/>
  <circle cx="184" cy="216" r="6" fill="#262c33"/>
  
  <!-- Downpipe vertical -->
  <path d="M184 228 L184 240" stroke="#262c33" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Eave line -->
  <path d="M16 156 L248 156" stroke="#262c33" stroke-width="2"/>
</svg>