<!DOCTYPE html>
<html lang="en-AU" class="no-js">
<head>
<meta charset="utf-8">

<style>:root{
  --bg:#f5f3ef;
  --ink:#23272b;
  --line:rgba(35,39,43,.08);
  --accent:#a8452a;
  --accent-strong:#8b3a22;
  --muted:rgba(35,39,43,.55);
  --panel:#ffffff;
  --panel-alt:#1b1e21;
  --ink-alt:#f5f3ef;
  --max:1200px;
  --nav-h:72px;
  --space-1:8px;
  --space-2:16px;
  --space-3:24px;
  --space-4:40px;
  --space-5:64px;
  --space-6:96px;
  --radius:0;
}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],header[id]{scroll-margin-top:calc(var(--nav-h,64px) + 12px)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
}
@font-face{font-family:system-ui;font-style:normal;font-weight:400;src:local("system-ui")}
@font-face{font-family:system-ui;font-style:normal;font-weight:700;src:local("system-ui")}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 18px/1.55 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* === REVEAL SYSTEM (JS-gated + no-JS fallback + safety net) === */
.no-js .rv{opacity:1;transform:none}
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.js .rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:0;transform:none;transition:none}
  .js .rv.on{opacity:1}
}

/* === LAYOUT PRIMITIVES === */
.container{width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--space-3)}
.grid{display:grid;gap:var(--space-3)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){
  .grid-2,.grid-3{grid-template-columns:1fr}
}
.flex{align-items:center;justify-content:space-between;gap:var(--space-2);display:flex;flex-wrap:wrap}
.section{padding:var(--space-5) 0}
.section-tight{padding:var(--space-4) 0}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* === NAV === */
.nav{
  position:sticky;top:0;z-index:100;
  height:var(--nav-h);
  background:rgba(245,243,239,.92);
  backdrop-filter:saturate(180%) blur(8px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  height:100%;
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--space-3);
}
.nav-logo{display:flex;align-items:center;gap:var(--space-2);text-decoration:none}
.nav-logo img{width:36px;height:36px;object-fit:contain}
.nav-logo span{font-weight:700;font-size:1.05rem;letter-spacing:-.02em}
.nav-links{display:flex;gap:var(--space-3);list-style:none;margin:0;padding:0}
.nav-links a{font-size:.85rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);transition:color .15s ease}
.nav-links a:hover{color:var(--ink);text-decoration:none}
.nav-cta{
  display:inline-flex;align-items:center;gap:var(--space-1);
  padding:10px 18px;
  background:var(--ink);
  color:#fff;
  border-radius:999px;
  font-weight:600;font-size:.9rem;
  text-decoration:none;
  transition:background .15s ease,transform .15s ease;
}
.nav-cta:hover{background:var(--accent);text-decoration:none;transform:translateY(-1px)}
@media (max-width:600px){
  .nav-links{display:none}
  .nav-cta span{display:none}
  .nav-cta{padding:10px 14px}
}
</style>
</style></head><body>
