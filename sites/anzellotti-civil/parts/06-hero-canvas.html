<script>
// === CHAINAGE SETOUT CANVAS 3D HERO ===
// Unique motion DNA: perspective runway of survey stakes + string lines + chainage ticks
// Drawing in from horizon, staggered arrival, then calm drift
// Differs from: screed-sweep (auzcrete), slab-grid-assembly, terrain-contour, batten-wave

(function() {
  const canvas = document.querySelector('.hero-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  let W = 0, H = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let t = 0;
  let rafId = null;
  let mouseX = -100, mouseY = -100;
  let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Camera / projection params (from CANVAS-3D HERO RECIPE)
  const camH = 1.35;      // camera height above floor
  const f = 1.15;         // focal length multiplier (x H)
  const horizonY = 0.54;  // horizon as fraction of H
  const zNear = 0.9;      // near plane clamp

  // Chainage setout data
  const numStakes = 24;   // stakes per side
  const stakeSpacing = 1.2; // spacing in world Z
  const roadWidth = 2.8;  // road width in world X
  const tickLength = 0.15; // chainage tick length

  // Stake positions (precomputed)
  const stakes = [];
  for (let i = 0; i < numStakes; i++) {
    const z = 1.0 + i * stakeSpacing;
    // Left side stakes
    stakes.push({ x: -roadWidth/2, z, side: 'L', index: i });
    // Right side stakes
    stakes.push({ x: roadWidth/2, z, side: 'R', index: i });
  }

  // String lines (edges of road)
  const stringLines = [
    { x1: -roadWidth/2, x2: -roadWidth/2 }, // left edge
    { x1: roadWidth/2, x2: roadWidth/2 }    // right edge
  ];

  // Chainage ticks (every 5 stakes = 20m chainage)
  const chainageTicks = [];
  for (let i = 0; i < numStakes; i += 5) {
    const z = 1.0 + i * stakeSpacing;
    chainageTicks.push({ z, value: (i+1) * 20 }); // 20m per stake
  }

  // Animation state
  const drawProgress = new Array(stakes.length).fill(0);
  const stringProgress = [0, 0];
  const tickProgress = new Array(chainageTicks.length).fill(0);
  const driftPhase = Math.random() * Math.PI * 2;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.round(rect.width * dpr);
    H = Math.round(rect.height * dpr);
    if (canvas.width !== W || canvas.height !== H) {
      canvas.width = W;
      canvas.height = H;
    }
    // CSS size is controlled by CSS, not JS
  }

  // Projection: varies BOTH axes (critical per CANVAS-3D HERO RECIPE)
  function project(x, z) {
    const s = (f * H) / z;
    const px = W/2 + x * s;
    const py = H * horizonY + camH * f * H / z;
    return { x: px, y: py, s };
  }

  function drawStake(stake, progress) {
    if (progress <= 0) return;
    const p = project(stake.x, stake.z);
    if (!isFinite(p.x) || !isFinite(p.y)) return;
    
    const h = Math.max(2, 18 * p.s / (f * H)) * progress;
    const w = Math.max(1, 3 * p.s / (f * H));
    
    ctx.save();
    ctx.translate(p.x, p.y);
    
    // Stake body
    ctx.fillStyle = 'rgba(35,39,43,0.6)';
    ctx.fillRect(-w/2, -h, w, h);
    
    // Top highlight
    ctx.fillStyle = 'rgba(168,69,42,0.8)';
    ctx.fillRect(-w/2, -h, w, Math.max(1, 2 * p.s / (f * H)));
    
    // Chainage mark on stake
    if (stake.index % 5 === 0 && progress > 0.5) {
      ctx.fillStyle = 'rgba(168,69,42,0.9)';
      ctx.font = `${Math.max(8, 10 * p.s / (f * H))}px ui-monospace,monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`${(stake.index+1)*20}`, 0, -h - 4);
    }
    
    ctx.restore();
  }

  function drawStringLine(line, progress) {
    if (progress <= 0) return;
    const zStart = 1.0;
    const zEnd = 1.0 + (numStakes - 1) * stakeSpacing;
    const zCurrent = zStart + (zEnd - zStart) * progress;
    
    ctx.beginPath();
    for (let z = zStart; z <= zCurrent; z += stakeSpacing * 0.1) {
      const p = project(line.x1, z);
      if (!isFinite(p.x) || !isFinite(p.y)) continue;
      if (z === zStart) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = 'rgba(35,39,43,0.25)';
    ctx.lineWidth = Math.max(1, 2 * dpr);
    ctx.stroke();
  }

  function drawChainageTick(tick, progress) {
    if (progress <= 0) return;
    const p = project(0, tick.z);
    if (!isFinite(p.x) || !isFinite(p.y)) return;
    
    const tickW = tickLength * p.s;
    const labelY = p.y + 16 * p.s / (f * H);
    
    ctx.save();
    // Tick mark (horizontal line across road)
    ctx.beginPath();
    const pL = project(-roadWidth/2 - tickLength, tick.z);
    const pR = project(roadWidth/2 + tickLength, tick.z);
    if (isFinite(pL.x) && isFinite(pL.y) && isFinite(pR.x) && isFinite(pR.y)) {
      ctx.moveTo(pL.x, pL.y);
      ctx.lineTo(pR.x, pR.y);
      ctx.strokeStyle = 'rgba(168,69,42,0.4)';
      ctx.lineWidth = Math.max(1, 1.5 * dpr);
      ctx.stroke();
    }
    
    // Chainage number
    if (progress > 0.3) {
      ctx.fillStyle = 'rgba(168,69,42,0.7)';
      ctx.font = `${Math.max(9, 11 * p.s / (f * H))}px ui-monospace,monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(`${tick.value}m`, p.x, labelY);
    }
    ctx.restore();
  }

  function drawHorizon() {
    // Subtle horizon line
    const y = H * horizonY;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.strokeStyle = 'rgba(35,39,43,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawFrame(progress) {
    ctx.clearRect(0, 0, W, H);
    
    drawHorizon();
    
    // Draw string lines (edges) - they draw first
    stringLines.forEach((line, i) => drawStringLine(line, stringProgress[i] * progress));
    
    // Draw stakes with staggered animation
    stakes.forEach((stake, i) => drawStake(stake, drawProgress[i] * progress));
    
    // Draw chainage ticks
    chainageTicks.forEach((tick, i) => drawChainageTick(tick, tickProgress[i] * progress));
  }

  function animate(ts) {
    if (!isFinite(ts)) { rafId = requestAnimationFrame(animate); return; }
    t = ts * 0.001;
    
    const progress = reducedMotion ? 1 : Math.min(1, t * 0.4);
    
    // Staggered stake arrival
    stakes.forEach((stake, i) => {
      const delay = i * 0.03;
      const localT = Math.max(0, t - delay);
      drawProgress[i] = reducedMotion ? 1 : Math.min(1, localT * 0.8);
    });
    
    // String lines draw continuously
    stringProgress[0] = stringProgress[1] = reducedMotion ? 1 : Math.min(1, t * 0.3);
    
    // Chainage ticks appear after stakes
    chainageTicks.forEach((tick, i) => {
      const delay = (i + 1) * 0.4;
      const localT = Math.max(0, t - delay);
      tickProgress[i] = reducedMotion ? 1 : Math.min(1, localT * 0.6);
    });
    
    // Calm drift after initial draw-in
    const drift = reducedMotion ? 0 : Math.sin(t * 0.15 + driftPhase) * 0.002;
    
    drawFrame(progress);
    
    if (!reducedMotion || progress < 1) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function init() {
    resize();
    drawFrame(1); // Initial draw (for reduced-motion, this is the static frame)
    
    if (!reducedMotion) {
      rafId = requestAnimationFrame(animate);
    }
    
    // Safety net: force complete after ~1100ms
    setTimeout(() => {
      if (!reducedMotion) {
        stakes.forEach((_, i) => drawProgress[i] = 1);
        stringProgress[0] = stringProgress[1] = 1;
        chainageTicks.forEach((_, i) => tickProgress[i] = 1);
        drawFrame(1);
      }
    }, 1100);
  }

  // Pointer sentinel (CANVAS SENTINEL LAW)
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
  });
  
  canvas.addEventListener('mouseleave', () => {
    mouseX = -100;
    mouseY = -100;
  });

  // Handle resize
  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      resize();
      drawFrame(1);
    }, 50);
  });

  // Reduced motion media query change
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  mq.addEventListener('change', (e) => {
    reducedMotion = e.matches;
    if (reducedMotion && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
      drawFrame(1);
    } else if (!reducedMotion && !rafId) {
      t = 0;
      rafId = requestAnimationFrame(animate);
    }
  });

  // Start when hero is visible (IntersectionObserver)
  const hero = document.querySelector('.hero');
  if (hero && 'IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          init();
          observer.disconnect();
        }
      });
    }, { rootMargin: '100px' });
    observer.observe(hero);
  } else {
    // Fallback
    init();
  }
})();
</script>
