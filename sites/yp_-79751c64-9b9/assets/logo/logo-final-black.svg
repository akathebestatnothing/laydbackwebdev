<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg"><title>Wrights plumbing</title>

<!-- Final chosen concept: A - Pipe Junction Monogram -->
<!-- Refined for production: centered, optical corrections, small-size cut -->

<defs>
  <style>
    .ink { stroke:#000000; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; fill:none; }
    .blaze { stroke:#000000; stroke-width: 8; stroke-linecap: round; fill:none; }
    .blaze-fill { fill:#000000; }
  </style>
</defs>

<!-- W structure (ink) - centered: verticals at 48, 112, 176 (span 128, centered at 128) -->
<g class="ink">
  <path d="M48 192V64" />
  <path d="M112 192V64" />
  <path d="M176 192V64" />
  <path d="M48 64L112 160" />
  <path d="M112 160L176 64" />
</g>

<!-- Pipe junction T-joint at center of W middle vertical (112, 128) -->
<g class="blaze">
  <path d="M80 128H144" />
  <path d="M112 96V160" />
  <circle cx="112" cy="128" r="4" class="blaze-fill" />
</g>

<!-- Connection pipe from junction to P stem -->
<path d="M144 128H192" class="blaze" />

<!-- P structure (ink) - vertical stem at x=192, bowl centered at 224,96 radius 32 -->
<g class="ink">
  <path d="M192 192V64" />
  <path d="M192 96A32 32 0 0 1 256 96" />
  <path d="M256 96V160" />
  <path d="M256 160A32 32 0 0 1 192 160" />
</g>
</svg>