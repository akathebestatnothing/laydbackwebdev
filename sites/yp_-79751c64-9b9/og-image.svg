<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Wrights Plumbing — The Entrance NSW</title>
<!-- OG Image for social sharing -->

<defs>
  <style>
    .bg { fill: #f0efe8; }
    .ink { fill: #1a1a2e; }
    .blaze { fill: #ff6b1a; }
    .blaze-stroke { stroke: #ff6b1a; stroke-width: 4; stroke-linecap: round; fill: none; }
  </style>
</defs>

<!-- Background -->
<rect width="1200" height="630" class="bg" />

<!-- Subtle grid pattern -->
<g stroke="#1a1a2e" stroke-width="0.5" opacity="0.05">
  <line x1="0" y1="0" x2="1200" y2="0" />
  <line x1="0" y1="630" x2="1200" y2="630" />
</g>

<!-- Logo symbol (large, centered left) -->
<g transform="translate(180, 180) scale(0.9)">
  <!-- W structure -->
  <g stroke="#1a1a2e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M48 192V64" />
    <path d="M112 192V64" />
    <path d="M176 192V64" />
    <path d="M48 64L112 160" />
    <path d="M112 160L176 64" />
  </g>
  <!-- Pipe junction -->
  <g stroke="#ff6b1a" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M80 128H144" />
    <path d="M112 96V160" />
    <circle cx="112" cy="128" r="4" fill="#ff6b1a" />
  </g>
  <path d="M144 128H192" stroke="#ff6b1a" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- P structure -->
  <g stroke="#1a1a2e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M192 192V64" />
    <path d="M192 96A32 32 0 0 1 256 96" />
    <path d="M256 96V160" />
    <path d="M256 160A32 32 0 0 1 192 160" />
  </g>
</g>

<!-- Text content (right side) -->
<text x="680" y="220" font-family="Archivo Black, sans-serif" font-size="72" font-weight="700" fill="#1a1a2e" text-anchor="middle">Wrights</text>
<text x="680" y="290" font-family="Archivo Black, sans-serif" font-size="36" font-weight="400" fill="#1a1a2e" text-anchor="middle" letter-spacing="0.1em">plumbing</text>

<!-- Tagline -->
<text x="680" y="370" font-family="Inter, sans-serif" font-size="24" fill="#1a1a2e" text-anchor="middle" opacity="0.7">Reliable, precise plumbing for The Entrance & Central Coast</text>

<!-- Phone -->
<text x="680" y="440" font-family="Archivo Black, sans-serif" font-size="32" font-weight="700" fill="#1a1a2e" text-anchor="middle">0415 432 848</text>

<!-- Location -->
<text x="680" y="490" font-family="Inter, sans-serif" font-size="18" fill="#1a1a2e" text-anchor="middle" opacity="0.6">The Entrance NSW 2261</text>

<!-- Blaze accent line -->
<line x1="500" y1="530" x2="860" y2="530" stroke="#ff6b1a" stroke-width="3" stroke-linecap="round" />

<!-- Instagram -->
<text x="680" y="560" font-family="Inter, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="middle" opacity="0.5">@wrightsplumbing · Licensed & Insured</text>
</svg>