<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Bailey Metal Roofing - Standing-seam rib mark (clean, flat colors, legible at small sizes) -->
  <!-- 3 vertical standing-seam ribs, center rib in oxide-red -->
  <!-- Flat colors only: field graphite #1e2226, zinc ink #e9ecee, accent oxide-red #cf4b2e -->
  <!-- Clean 90° angles, centered, minimal anchors -->

  <title>Bailey Metal Roofing logo</title>

  <!-- Left rib (zinc) - with subtle seam -->
  <path d="M52 16 L52 240 L76 240 L76 16 Z" fill="#e9ecee"/>
  <!-- Seam highlight (thin dark line at left edge of rib) -->
  <path d="M52 16 L56 16 L56 240 L52 240 Z" fill="#1e2226"/>

  <!-- Center rib (oxide-red accent) - slightly wider -->
  <path d="M98 16 L98 240 L146 240 L146 16 Z" fill="#cf4b2e"/>
  <!-- Seam highlight -->
  <path d="M98 16 L104 16 L104 240 L98 240 Z" fill="#1e2226"/>

  <!-- Right rib (zinc) -->
  <path d="M180 16 L180 240 L204 240 L204 16 Z" fill="#e9ecee"/>
  <!-- Seam highlight -->
  <path d="M180 16 L184 16 L184 240 L180 240 Z" fill="#1e2226"/>
</svg>