<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><title>Cassidys W. Cleaning Service</title><g transform="translate(-35.84 -35.84) scale(1.28)">
  
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dde6ea" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2f7d78" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d1116" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="squeegee" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f7d78"/>
      <stop offset="100%" stop-color="#1a5c57"/>
    </linearGradient>
  </defs>
  
  <!-- Glass pane background -->
  <rect x="32" y="48" width="192" height="160" rx="8" fill="#14191f" stroke="#232b33" stroke-width="1.5"/>
  
  <!-- Clean glass reveal bands (squeegee wipe paths) -->
  <g fill="none" stroke="url(#glass)" stroke-width="18" stroke-linecap="round" opacity="0.85">
    <path d="M56 72 L200 72"/>
    <path d="M56 128 L200 128"/>
    <path d="M56 184 L200 184"/>
  </g>
  
  <!-- Squeegee blade mid-stroke -->
  <g transform="translate(128, 128) rotate(-15)">
    <!-- Blade holder -->
    <rect x="-40" y="-4" width="80" height="8" rx="2" fill="#0d1116"/>
    <!-- Rubber blade -->
    <rect x="-38" y="4" width="76" height="6" rx="1.5" fill="url(#squeegee)"/>
    <!-- Water bead trail -->
    <g fill="#2f7d78" opacity="0.9">
      <circle cx="-30" cy="16" r="2.5"/>
      <circle cx="-10" cy="20" r="2"/>
      <circle cx="12" cy="17" r="2.5"/>
      <circle cx="32" cy="22" r="1.5"/>
    </g>
  </g>
  
  <!-- Faint reflection band on glass -->
  <path d="M48 60 Q128 40 208 60" fill="none" stroke="#dde6ea" stroke-width="1" stroke-opacity="0.15" stroke-linecap="round"/>
</g></svg>