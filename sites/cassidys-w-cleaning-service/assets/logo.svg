<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="lg-t lg-d">
  <title id="lg-t">Cassidys W. Cleaning Service</title>
  <desc id="lg-d">A squeegee blade pulling two clean bands across dark glass.</desc>
  <defs>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe7e4"/>
    </linearGradient>
    <linearGradient id="rub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fa79f"/>
      <stop offset="1" stop-color="#2f7d78"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#0d1116"/>
    <rect width="64" height="64" fill="#2f7d78" opacity="0.14"/>
    <g transform="rotate(-16 32 34)">
      <g fill="url(#mist)">
        <rect x="-18" y="9" width="100" height="8" rx="1"/>
        <rect x="-18" y="22" width="100" height="8" rx="1" opacity="0.78"/>
      </g>
      <rect x="-18" y="35" width="100" height="10" fill="url(#mist)"/>
      <rect x="-18" y="45" width="100" height="7" fill="url(#rub)"/>
      <rect x="28" y="49" width="8" height="24" rx="4" fill="#8fd3cc"/>
    </g>
  </g>
  <rect x="0.9" y="0.9" width="62.2" height="62.2" rx="14.2" fill="none" stroke="#8fd3cc" stroke-opacity="0.5" stroke-width="1.8"/>
</svg>
