<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Concrete construction across the Hunter region — driveways, slabs, footings, paths and finishes.">
<title>DWA Concrete — Concrete Construction, Hunter NSW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Wix+Madefor+Text:wght@400;500;600&family=Inconsolata:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ /* lbq-contrast */ --bg:#e8e8e5;--line:rgba(23,24,26,.16);--accent:#b5ee3f;
  --field:#e8e8e5; --panel:#dcdcd8; --ink:#17181a; --muted:#6f7276;
  --hairline:rgba(23,24,26,.14); --volt:#b5ee3f; --keyway:#93959a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:'Wix Madefor Text',system-ui,sans-serif;
  background:var(--field); color:var(--ink);
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.js .rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:1;transform:none;transition:none}
}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;height:auto;display:block}
/* Nav strip */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px; background:var(--panel);
  border-bottom:1px solid var(--hairline);
  position:sticky;top:0;z-index:100;
}
.nav__wordmark{
  font-family:'Khand',sans-serif;font-weight:700;font-size:1.1rem;
  letter-spacing:.02em;display:flex;align-items:center;gap:8px;
}
.nav__keyway{
  width:8px;height:8px;border-radius:50%;background:var(--ink);
  flex-shrink:0;
}
.nav__links{display:flex;gap:24px;font-family:'Inconsolata',monospace;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.nav__links a{opacity:.7}
.nav__links a:hover{opacity:1}
.nav__tel{font-family:'Inconsolata',monospace;font-size:.75rem;opacity:.7;white-space:nowrap}
@media (max-width:760px){
  .nav__links{display:none}
}
/* Hero */
.hero{
  position:relative;min-height:60vh;display:flex;flex-direction:column;justify-content:center;
  padding:60px 20px 80px; overflow:hidden;
}
.hero__canvas{position:absolute;inset:0;z-index:0;width:100%;height:100%}
.hero__content{position:relative;z-index:1;max-width:720px}
.hero__eyebrow{
  font-family:'Inconsolata',monospace;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px
}
.hero__title{
  font-family:'Khand',sans-serif;font-weight:700;font-size:clamp(2.5rem,6vw,4rem);
  line-height:1.05;letter-spacing:-.02em;margin-bottom:16px
}
.hero__sub{font-size:1.1rem;color:var(--muted);margin-bottom:32px;max-width:540px}
.hero__cta{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 28px;font-family:'Khand',sans-serif;font-weight:600;font-size:.95rem;
  background:var(--volt);color:var(--ink);border:none;cursor:pointer;
  transition:background .2s,color .2s
}
.btn:hover{background:#a0d635;color:var(--ink);text-decoration:none}
.btn--tel{background:transparent;color:var(--ink);border:1px solid var(--hairline)}
.btn--tel:hover{background:var(--panel);border-color:var(--ink);text-decoration:none}
/* Cut line divider */
.cut{
  position:relative;height:2px;background:var(--ink);margin:0;
}
.cut::before,.cut::after{
  content:'';position:absolute;top:50%;transform:translateY(-50%);
  width:12px;height:2px;background:var(--field);
}
.cut::before{left:calc(50% - 18px)}
.cut::after{right:calc(50% - 18px)}
.cut__keyway{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;
  border:2px solid var(--ink);background:var(--field);
}
.cut--volt .cut__keyway{background:var(--volt);border-color:var(--volt)}
/* Section */
.section{padding:60px 20px}
.section__inner{max-width:880px;margin:0 auto}
.section__caption{
  font-family:'Inconsolata',monospace;font-size:.65rem;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:24px;display:flex;align-items:center;gap:12px
}
.section__caption::before{
  content:'';width:40px;height:1px;background:var(--hairline)
}
/* Cut List (services) */
.cutlist{margin-top:16px}
.cutlist__row{
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  padding:18px 0;border-bottom:1px solid var(--hairline)
}
.cutlist__row:last-child{border-bottom:none}
.cutlist__index{
  font-family:'Inconsolata',monospace;font-size:.8rem;font-weight:500;color:var(--muted);
  width:2.5em;text-align:right
}
.cutlist__name{font-family:'Khand',sans-serif;font-weight:600;font-size:1.1rem}
.cutlist__keyway{
  width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--field);flex-shrink:0
}
.cutlist__row:nth-child(3) .cutlist__keyway{background:var(--volt);border-color:var(--volt)}
/* Joint Sequence (process) */
.jointseq{
  position:relative;padding-top:40px;padding-bottom:20px
}
.jointseq__line{
  position:absolute;top:50%;left:10%;right:10%;height:2px;background:var(--ink);transform:translateY(-50%)
}
.jointseq__station{
  position:relative;display:flex;flex-direction:column;align-items:center;
  width:20%;min-width:140px
}
.jointseq__stations{
  display:flex;justify-content:space-between;position:relative;z-index:1
}
.jointseq__num{
  font-family:'Inconsolata',monospace;font-size:.75rem;font-weight:500;
  color:var(--muted);margin-bottom:8px
}
.jointseq__tick{
  position:relative;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--ink);background:var(--field);z-index:2
}
.jointseq__station:nth-child(3) .jointseq__tick{background:var(--volt);border-color:var(--volt)}
.jointseq__label{
  font-family:'Khand',sans-serif;font-weight:600;font-size:.9rem;text-align:center;margin-top:10px;max-width:140px
}
/* Statement band */
.statement{
  position:relative;padding:60px 20px;background:var(--panel);
  border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)
}
.statement__frame{
  position:absolute;inset:20px;border:1px solid var(--hairline);pointer-events:none
}
.statement__inner{max-width:720px;margin:0 auto;position:relative;z-index:1;text-align:center}
.statement__line{
  font-family:'Khand',sans-serif;font-weight:700;font-size:clamp(1.5rem,3.5vw,2.2rem);
  line-height:1.15;margin-bottom:12px
}
.statement__sub{font-size:1.05rem;color:var(--muted)}
/* Quote section (injected) */
.quote{padding:60px 20px}
.quote__inner{max-width:880px;margin:0 auto}
.quote__heading{
  font-family:'Khand',sans-serif;font-weight:700;font-size:clamp(1.5rem,3.5vw,2.2rem);
  margin-bottom:24px
}
/* Footer */
.footer{
  background:var(--panel);border-top:1px solid var(--hairline);
  padding:40px 20px
}
.footer__inner{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:16px;text-align:center}
.footer__legal{font-family:'Khand',sans-serif;font-weight:700;font-size:1.1rem}
.footer__region{font-size:.95rem;color:var(--muted)}
.footer__contact{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;font-family:'Inconsolata',monospace;font-size:.85rem}
.footer__contact a{opacity:.8}
.footer__contact a:hover{opacity:1}
.footer__copy{font-size:.75rem;color:var(--muted)}
/* Mobile adjustments */
@media (max-width:600px){
  .hero{min-height:55vh;padding:40px 16px 70px}
  .section{padding:40px 16px}
  .cutlist__name{font-size:1rem}
  .statement__frame{inset:12px}
}
@media (max-width:820px){
  .jointseq{padding-top:24px;padding-bottom:8px}
  .jointseq__line{display:none}
  .jointseq__stations{flex-direction:column;align-items:flex-start;gap:20px}
  .jointseq__station{flex-direction:row;align-items:center;gap:12px;width:auto;min-width:0}
  .jointseq__num{margin:0;min-width:2.2em}
  .jointseq__tick{flex-shrink:0}
  .jointseq__label{margin:0;text-align:left;max-width:none;font-size:.95rem}
}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<nav class="nav" role="navigation" aria-label="Main">
  <div class="nav__wordmark"><span class="nav__keyway"></span>DWA Concrete</div>
  <div class="nav__links">
    <a href="#cutlist">Cut list</a>
    <a href="#jointseq">Sequence</a>
    <a href="#quote">Contact</a>
  </div>
  <a class="nav__tel" href="tel:__PHONE_TEL__">__PHONE_DISPLAY__</a>
</nav>
<header class="hero rv">
  <canvas class="hero__canvas" aria-hidden="true"></canvas>
  <div class="hero__content">
    <p class="hero__eyebrow">CONCRETE CONSTRUCTION · HUNTER REGION, NSW</p>
    <h1 class="hero__title">DWA Concrete</h1>
    <p class="hero__sub">Concrete work for homes and projects across the Hunter region — driveways, slabs, footings and finishes.</p>
    <div class="hero__cta">
      <a class="btn" href="#quote">Request a quote</a>
      <a class="btn btn--tel" href="tel:__PHONE_TEL__">__PHONE_DISPLAY__</a>
    </div>
  </div>
</header>
<div class="cut cut--volt rv" aria-hidden="true"><span class="cut__keyway"></span></div>
