<style>
:root{
  --bg:#f5f8f9;--panel:#ffffff;--ink:#0f1720;--muted:#5c6e7e;
  --line:rgba(15,23,32,.12);--hair:#d7e0e6;
  --cold:#1f7fd8;--hot:#e8593f;--steel:#93a7b6;--accent:#1f7fd8;
  --disp:"Tektur",system-ui,sans-serif;
  --body:"Hubot Sans",system-ui,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2{font-family:var(--disp);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin:0}
p{margin:0}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:10px 16px;z-index:100}
.skip:focus{left:12px;top:12px}
.rv{opacity:1}
.js .rv{opacity:0;transform:translateY(20px)}
.js .rv.on{opacity:1;transform:none;transition:opacity .7s ease,transform .75s cubic-bezier(.2,.75,.2,1)}
/* sticky spec-strip */
.specstrip{position:sticky;top:0;z-index:40;background:rgba(245,248,249,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.specstrip .in{display:flex;align-items:center;gap:18px;height:44px;max-width:1180px;margin:0 auto;padding:0 28px}
.wordmark{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:.84rem;letter-spacing:.02em;white-space:nowrap}
.wordmark img{width:22px;height:22px;flex:0 0 auto}
.wordmark .dot{color:var(--cold)}
.navmid{display:flex;gap:22px;margin-left:10px}
.navmid a{color:var(--muted)}
.navmid a:hover{color:var(--ink)}
.sp{flex:1}
.open24{color:var(--muted);font-size:.66rem}
.navcall{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;border-bottom:1px solid transparent}
.navcall:hover{border-color:var(--cold)}
.mobnav{display:none;gap:8px}
.mobnav a{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;padding:7px 11px;border:1px solid var(--line);border-radius:3px}
.mobnav .c{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* hero */
.hero{padding:44px 0 30px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.02fr 1.18fr;gap:42px;align-items:center}
.hero-copy{max-width:560px}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:var(--muted);margin-bottom:20px}
.hero h1{font-size:clamp(2.6rem,6vw,5rem);margin:0 0 22px}
.hero h1 em{font-style:normal;color:var(--cold)}
.lede{color:var(--muted);font-size:1.06rem;max-width:44ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 0}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--body);font-weight:600;font-size:.92rem;padding:13px 20px;border-radius:3px;border:1px solid transparent;transition:background .16s ease,color .16s ease,border-color .16s ease}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ink:hover{background:#243342}
.btn-ghost{border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--cold);color:var(--cold)}
.factrow{display:flex;flex-wrap:wrap;margin:30px 0 0;border-top:1px solid var(--line)}
.fact{padding:14px 20px 0 0;margin-right:20px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0;margin-right:0;padding-right:0}
.fact b{display:block;font-family:var(--mono);font-weight:400;font-size:.64rem;letter-spacing:.13em;color:var(--steel)}
.fact span{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--ink)}
.hero-canvas-wrap{position:relative;height:62vh;min-height:420px;border:1px solid var(--line);background:var(--panel);overflow:hidden}
#manifold{width:100%;height:100%;display:block}
.clabel{position:absolute;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;pointer-events:none}
.clabel.cold{color:var(--cold)}
.clabel.hot{color:var(--hot)}
.clabel.ink{color:var(--ink)}
.readout{border-bottom:1px solid var(--line);background:var(--panel)}
.readout .in{display:flex;flex-wrap:wrap;align-items:center;min-height:46px;max-width:1180px;margin:0 auto;padding:0 28px;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;color:var(--muted)}
.readout span{padding:6px 16px;border-right:1px solid var(--line)}
.readout span:first-child{padding-left:0}
/* services pipe-run rows */
.runrows{padding:84px 0}
.sechead{display:flex;align-items:baseline;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sechead h2{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.sechead .lbl{color:var(--cold)}
.rr{display:grid;grid-template-columns:64px 1.35fr 1fr 40px;gap:22px;align-items:center;padding:24px 0;border-top:1px solid var(--line);position:relative}
.rr:last-child{border-bottom:1px solid var(--line)}
.rr .rule{position:absolute;left:0;right:0;top:-1px;height:1px;background:var(--cold);transform:scaleX(0);transform-origin:left;transition:transform .38s cubic-bezier(.2,.75,.2,1)}
.rr:hover .rule{transform:scaleX(1)}
.rr-i{font-family:var(--mono);font-size:.72rem;color:var(--steel)}
.rr-n{font-family:var(--disp);font-weight:600;font-size:1.4rem;letter-spacing:-.01em}
.rr-scope{color:var(--muted);font-size:.94rem}
.tick{display:inline-flex;flex-direction:column;gap:5px;align-items:flex-end}
.tick i{display:block;width:22px;height:2px;background:var(--steel)}
.rr:hover .tick i:first-child{background:var(--cold)}
.rr:hover .tick i:last-child{background:var(--hot)}
/* statement */
.statement{padding:96px 0;border-top:1px solid var(--line)}
.statement h2{font-size:clamp(2.4rem,7vw,5.2rem);letter-spacing:-.03em}
.statement .cols{display:grid;grid-template-columns:.95fr 1.05fr;gap:40px;margin-top:34px;max-width:920px}
.statement .cols .lbl{color:var(--hot)}
.statement p{color:var(--muted);margin-bottom:14px}
