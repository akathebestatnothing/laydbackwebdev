<!doctype html>
<html lang="en-AU" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strolin Landscapes | Landscape design and garden construction, Terrigal</title>
<meta name="description" content="Strolin Landscapes is a landscape design and garden construction studio in Terrigal, working across the Central Coast. Design-led gardens, drawn first and built to plan.">
<meta name="theme-color" content="#142e26">
<meta property="og:type" content="website">
<meta property="og:title" content="Strolin Landscapes | Landscape design and garden construction, Terrigal">
<meta property="og:description" content="Design-led landscape and garden construction in Terrigal and the Central Coast.">
<meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Mona+Sans:wght@300;400;500;600&family=Oxygen+Mono&display=swap" rel="stylesheet">
<script>document.documentElement.className="js";</script>
<style>
:root{
  --field:#142e26; --bone:#f3ecdd; --clay:#cf7a52; --sage:#9db892; --inktext:#0d1f1a;
  --bg:#142e26; --line:rgba(243,236,221,.16); --accent:#cf7a52; --panel:rgba(243,236,221,.05);
  --muted:#a9bdb2; --serif:'Gloock',Georgia,serif; --sans:'Mona Sans',system-ui,-apple-system,sans-serif; --mono:'Oxygen Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--field);color:var(--bone);font-family:var(--sans);font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;margin:0;letter-spacing:-.005em}
h1{font-size:clamp(2.1rem,5.6vw,4rem)}
h2{font-size:clamp(1.5rem,3.3vw,2.35rem)}
h3{font-size:1.18rem}
p{margin:0 0 1em}
a{color:inherit}
img{max-width:100%;display:block}
svg{display:block}
.mono{font-family:var(--mono)}
.wrap{width:min(1120px,calc(100% - 44px));margin:0 auto}
.skip{position:absolute;left:-9999px}
.skip:focus{left:14px;top:14px;z-index:99;background:var(--bone);color:var(--inktext);padding:9px 14px;border-radius:8px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}
/* nav */
.tracebar{position:sticky;top:0;z-index:50;background:rgba(20,46,38,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tracebar .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:24px;height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-family:var(--serif);font-size:1.08rem;letter-spacing:.01em}
.brand img{width:27px;height:27px}
.navlinks{display:flex;gap:27px;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase}
.navlinks a{text-decoration:none;opacity:.82;padding:6px 0;border-bottom:1px solid transparent}
.navlinks a:hover,.navlinks a:focus{opacity:1;color:var(--clay);border-bottom-color:var(--clay)}
.chip{display:inline-flex;align-items:center;gap:9px;padding:9px 17px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:.85rem;white-space:nowrap}
.chip:hover,.chip:focus{border-color:var(--clay);color:var(--clay)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--clay)}
.traceprogress{height:2px;background:var(--clay);width:0}
.burger{display:none;appearance:none;background:none;border:1px solid var(--line);border-radius:9px;color:var(--bone);width:42px;height:38px;cursor:pointer;font-family:var(--mono);font-size:.9rem}
/* hero */
.bedfield{position:relative;overflow:hidden;border-bottom:1px solid var(--line);min-height:84vh;display:flex}
#bedcanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:30px;width:100%;padding:78px 0 64px;align-content:start}
.hero-copy{max-width:640px;padding-top:6px}
.hero-copy h1{margin:14px 0 18px}
.hero-copy .lead{font-size:1.12rem;color:#d7e2da;max-width:52ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;padding:13px 22px;border-radius:999px;font-size:.92rem;font-weight:500}
.btn-p{background:var(--clay);color:#12100e}
.btn-p:hover{background:#d98a63}
.btn-g{border:1px solid var(--line);color:var(--bone)}
.btn-g:hover{border-color:var(--clay);color:var(--clay)}
.hero-note{margin-top:34px;font-family:var(--mono);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sage)}
</style>
</head>
<body>
