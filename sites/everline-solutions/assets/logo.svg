<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" id="logo">
  <title>Everline Solutions</title>
  <!-- Service Loop mark: rounded rectangle loop with check nodes and clipboard -->
  <!-- Brand colour: amber #775500 on ink #14140f -->
  <!-- The loop represents the continuous maintenance cycle -->
  
  <!-- Main loop: rounded rectangle path (filled shape with stroke) -->
  <path d="M40 24 
    h176 
    a24 24 0 0 1 24 24 
    v136 
    a24 24 0 0 1 -24 24 
    h-176 
    a24 24 0 0 1 -24 -24 
    v-136 
    a24 24 0 0 1 24 -24z" 
    fill="none" stroke="#775500" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Check nodes: 4 filled circles at N, E, S, W midpoints -->
  <!-- North node (top edge center) -->
  <circle cx="128" cy="24" r="18" fill="#775500"/>
  <!-- Number 1 as path (simplified) -->
  <path d="M122 18 L122 36 M122 18 L118 24 M122 18 L126 24" stroke="#14140f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- East node (right edge center) -->
  <circle cx="216" cy="112" r="18" fill="#775500"/>
  <path d="M210 106 L210 124 M210 106 L206 112 M210 106 L214 112" stroke="#14140f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- South node (bottom edge center) - SCHEDULE NODE with wrench/tick -->
  <circle cx="128" cy="200" r="18" fill="#775500"/>
  <!-- Wrench/tick glyph at schedule node (south) - all paths -->
  <g transform="translate(128, 200)">
    <!-- Wrench head -->
    <path d="M-7 -5 L-3 -10 L3 -5 L-1 0z" fill="#14140f"/>
    <!-- Wrench handle -->
    <path d="M-1.5 5 L-1.5 18 L1.5 18 L1.5 5z" fill="#14140f"/>
    <!-- Tick mark on wrench -->
    <path d="M-5 11 L-2 14 L5 8" stroke="#14140f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- West node (left edge center) -->
  <circle cx="40" cy="112" r="18" fill="#775500"/>
  <path d="M34 106 L34 124 M34 106 L30 112 M34 106 L38 112" stroke="#14140f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Clipboard/checklist panel docked to the loop (attached to east side) -->
  <g transform="translate(224, 68)">
    <!-- Clipboard back - filled rect -->
    <rect x="0" y="0" width="28" height="52" rx="4" fill="#775500"/>
    <!-- Clipboard clip at top -->
    <rect x="7" y="-5" width="14" height="7" rx="1.5" fill="#1c1c18"/>
    <!-- Checklist lines as thin filled rects -->
    <rect x="5" y="11" width="18" height="2" fill="#14140f"/>
    <rect x="5" y="23" width="14" height="2" fill="#14140f"/>
    <rect x="5" y="35" width="20" height="2" fill="#14140f"/>
    <!-- Check marks on first two lines as paths -->
    <path d="M23 9 L27 13 L32 6" stroke="#14140f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M19 21 L23 25 L26 19" stroke="#14140f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>