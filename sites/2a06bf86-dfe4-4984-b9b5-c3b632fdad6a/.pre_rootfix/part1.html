<!doctype html>
<html lang="en-AU" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WJS Concrete — Concreting in Redhead, NSW</title>
<meta name="description" content="Concreting work across Redhead and the Newcastle region — driveways, slabs, paths and finishes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gantari:wght@600;700;800&family=Golos+Text:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ /* lbq-contrast */ --bg:#e7e4de;--line:rgba(26,28,29,.16);
  --field:#e7e4de;
  --panel:#dcd8d0;
  --ink:#1a1c1d;
  --muted:#6d7175;
  --hairline:rgba(26,28,29,.14);
  --speckle-1:#2e2f31;
  --speckle-2:#8a8478;
  --speckle-3:#bdb7aa;
  --oxide:#8a4a2b;
  --radius:0;
}
*, *::before, *::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *, *::before, *::after{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important}
}
body{
  margin:0;
  font-family:'Golos Text',system-ui,sans-serif;
  background:var(--field);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
img{max-width:100%; height:auto; display:block}
a{color:inherit; text-decoration:none}
a:hover{text-decoration:underline}
.phone-link{text-decoration:underline; text-underline-offset:2px}
.phone-link:hover{text-decoration:none}
.rv{opacity:1; transform:none; transition:opacity .6s ease, transform .6s ease}
.js .rv{opacity:0; transform:translateY(12px)}
.rv.on{opacity:1; transform:none}
.no-js .rv{opacity:1; transform:none}
.speckle-bg{
  position:absolute; inset:0;
  background-image:
    radial-gradient(2px 2px at 12% 18%, var(--speckle-1) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 34% 42%, var(--speckle-2) 50%, transparent 51%),
    radial-gradient(1px 1px at 56% 28%, var(--speckle-3) 50%, transparent 51%),
    radial-gradient(2px 2px at 78% 64%, var(--speckle-1) 50%, transparent 51%),
    radial-gradient(1px 1px at 89% 12%, var(--speckle-2) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 5% 82%, var(--speckle-3) 50%, transparent 51%),
    radial-gradient(2px 2px at 45% 76%, var(--speckle-1) 50%, transparent 51%),
    radial-gradient(1px 1px at 67% 91%, var(--speckle-2) 50%, transparent 51%);
  background-size:200px 200px;
  opacity:.35;
  pointer-events:none;
}
.speckle-bg--thin{opacity:.18}
.hairline-h{height:1px; background:var(--hairline); border:none}
.hairline-v{width:1px; height:100%; background:var(--hairline); border:none; position:absolute; top:0; bottom:0}
.seam{position:absolute; top:0; bottom:0; width:1px; background:var(--hairline); pointer-events:none}
.wordmark{font-family:'Gantari',system-ui,sans-serif; font-weight:800; font-size:clamp(1.25rem,3.5vw,1.75rem); letter-spacing:-.02em; line-height:1.1}
.eyebrow{font-family:'Geist Mono',monospace; font-weight:500; font-size:.7rem; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:.5rem}
.eyebrow .bullet{display:inline-block; width:.5rem; height:.5rem; background:var(--oxide); margin-right:.5rem; vertical-align:middle}
h1{font-family:'Gantari',system-ui,sans-serif; font-weight:800; font-size:clamp(2.5rem,7vw,4.5rem); line-height:1.05; letter-spacing:-.03em; margin:0}
h2{font-family:'Gantari',system-ui,sans-serif; font-weight:700; font-size:clamp(1.75rem,4.5vw,3rem); line-height:1.15; letter-spacing:-.02em; margin:0 0 .75rem}
h3{font-family:'Gantari',system-ui,sans-serif; font-weight:600; font-size:clamp(1.1rem,2.5vw,1.4rem); line-height:1.2; margin:0 0 .5rem}
p{margin:0 0 1rem; color:var(--ink)}
.muted{color:var(--muted)}
.label{font-family:'Geist Mono',monospace; font-weight:500; font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
.oxide-underline{text-decoration:underline; text-decoration-color:var(--oxide); text-underline-offset:3px; text-decoration-thickness:2px}
.container{width:100%; max-width:1200px; margin:0 auto; padding:0 clamp(1rem,4vw,3rem)}
.section{padding:clamp(3rem,8vw,6rem) 0; position:relative}
.section::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--hairline); transform:translateX(-50%); pointer-events:none}
@media (max-width:760px){.section::before{display:none}}
.btn{display:inline-block; padding:.875rem 1.75rem; font-family:'Gantari',system-ui,sans-serif; font-weight:700; font-size:.95rem; letter-spacing:-.01em; border:2px solid var(--ink); background:var(--ink); color:var(--field); transition:background .2s ease, color .2s ease, border-color .2s ease}
.btn:hover{background:transparent; color:var(--ink); text-decoration:none}
.btn--phone{background:transparent; color:var(--ink); border-color:var(--ink)}
.btn--phone:hover{background:var(--ink); color:var(--field)}

.chip{display:inline-flex; align-items:center; justify-content:center; width:2.5rem; height:2.5rem; border-radius:999px; background:var(--panel); position:relative; flex-shrink:0}
.chip::before{content:""; position:absolute; inset:2px; border-radius:999px; background:
  radial-gradient(3px 3px at 30% 30%, var(--speckle-1) 50%, transparent 51%),
  radial-gradient(2px 2px at 70% 65%, var(--speckle-2) 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 45% 45%, var(--speckle-3) 50%, transparent 51%);
  background-size:100% 100%}
.chip-index{font-family:'Geist Mono',monospace; font-weight:500; font-size:.65rem; color:var(--muted); z-index:1}
.slab{display:flex; align-items:center; gap:1rem; width:100%; min-height:72px; max-height:96px; background:var(--panel); border:1px solid var(--hairline); position:relative}
.slab:hover{background:#d4cfc5}
.slab__name{font-family:'Gantari',system-ui,sans-serif; font-weight:700; font-size:clamp(.95rem,2vw,1.15rem); letter-spacing:-.015em; flex:1; padding-right:1.5rem}
.step{display:flex; gap:1.5rem; padding:1.5rem 0; border-top:1px solid var(--hairline)}
.step:first-child{border-top:none}
.step__num{font-family:'Geist Mono',monospace; font-weight:500; font-size:clamp(1.5rem,3vw,2rem); color:var(--oxide); line-height:1; flex-shrink:0; width:3.5rem; text-align:right; padding-top:.15rem}
.step__text{flex:1; padding-top:.15rem}
.step__text p:last-child{margin-bottom:0}
.reveal-cut{position:relative; height:120px; background:var(--panel); border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); overflow:hidden}
.reveal-cut--thin{height:16px}
.reveal-cut--statement{height:140px}
#hero-canvas{display:block; width:100%; height:100%}
@media (prefers-reduced-motion:reduce){
  #hero-canvas{display:none}
  .reveal-cut::after{content:""; position:absolute; inset:0; background:
    radial-gradient(2px 2px at 10% 50%, var(--speckle-1) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 25% 45%, var(--speckle-2) 50%, transparent 51%),
    radial-gradient(1px 1px at 40% 55%, var(--speckle-3) 50%, transparent 51%),
    radial-gradient(2px 2px at 55% 50%, var(--speckle-1) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 70% 48%, var(--speckle-2) 50%, transparent 51%),
    radial-gradient(1px 1px at 85% 52%, var(--speckle-3) 50%, transparent 51%),
    radial-gradient(2px 2px at 95% 50%, var(--speckle-1) 50%, transparent 51%);
    background-size:auto 100%; background-position:center; background-repeat:no-repeat; opacity:.4}
}
.nav{position:sticky; top:0; z-index:100; background:var(--field); border-bottom:1px solid var(--hairline)}
.nav__inner{display:flex; align-items:center; justify-content:space-between; height:56px; max-width:1200px; margin:0 auto; padding:0 clamp(1rem,4vw,3rem)}
.nav__links{display:flex; align-items:center; gap:2rem}
.nav__link{font-family:'Gantari',system-ui,sans-serif; font-weight:600; font-size:.85rem; letter-spacing:-.01em; color:var(--ink); text-decoration:none}
.nav__link:hover{color:var(--oxide); text-decoration:none}
.nav__phone{font-family:'Gantari',system-ui,sans-serif; font-weight:700; font-size:.85rem; letter-spacing:-.01em; color:var(--ink); text-decoration:underline; text-underline-offset:2px}
.nav__phone:hover{color:var(--oxide); text-decoration:none}
@media (max-width:760px){
  .nav__links{display:none}
  .nav__phone{display:inline-block}
}
.hero{position:relative; padding:clamp(3rem,6vw,5rem) 0 clamp(2rem,4vw,3rem); overflow:hidden}
.hero__inner{position:relative; z-index:1}
.hero__eyebrow{margin-bottom:.75rem}
.hero__title{margin-bottom:1rem}
.hero__sub{max-width:55ch; margin-bottom:2rem; font-size:clamp(1rem,2.2vw,1.2rem); line-height:1.6; color:var(--muted)}
.hero__cta{display:flex; flex-wrap:wrap; gap:1rem; align-items:center}
.scope-slab{background:var(--field)}
.scope-slab .slab-stack{display:flex; flex-direction:column; gap:.75rem}
.pour-flow{background:var(--panel)}
.pour-flow .step:first-child{border-top:1px solid var(--hairline)}
.statement-band{background:var(--field); text-align:center}
.statement-band .reveal-cut--statement{margin-bottom:2rem}
.statement-band__title{font-family:'Gantari',system-ui,sans-serif; font-weight:800; font-size:clamp(1.5rem,4vw,2.5rem); line-height:1.15; letter-spacing:-.02em; margin:0 0 .75rem}
.statement-band__sub{max-width:60ch; margin:0 auto; font-size:clamp(1rem,2.2vw,1.15rem); line-height:1.6; color:var(--muted)}
.quote{background:var(--panel)}
.quote__heading{font-family:'Gantari',system-ui,sans-serif; font-weight:700; font-size:clamp(1.5rem,3.5vw,2.25rem); line-height:1.2; margin:0 0 .5rem}
.quote__lead{color:var(--muted); margin-bottom:2rem}
footer{background:var(--ink); color:var(--field); padding:3rem 0 2rem}
.footer__inner{display:flex; flex-wrap:wrap; gap:2rem; justify-content:space-between; align-items:flex-start; max-width:1200px; margin:0 auto; padding:0 clamp(1rem,4vw,3rem)}
.footer__brand{flex:1; min-width:200px}
.footer__wordmark{font-family:'Gantari',system-ui,sans-serif; font-weight:800; font-size:clamp(1.1rem,2.5vw,1.5rem); letter-spacing:-.02em; margin-bottom:.5rem}
.footer__location{font-size:.9rem; color:rgba(231,228,222,.7); margin-bottom:1rem}
.footer__phone{font-family:'Gantari',system-ui,sans-serif; font-weight:700; font-size:.95rem; color:var(--field); text-decoration:underline; text-underline-offset:2px}
.footer__phone:hover{color:var(--oxide); text-decoration:none}
.footer__copy{font-size:.8rem; color:rgba(231,228,222,.5); margin-top:2rem; width:100%}
@media (max-width:600px){
  .footer__inner{flex-direction:column; gap:1.5rem}
}
</style>
</head>
<body>
<nav class="nav" role="navigation" aria-label="Main">
  <div class="nav__inner">
    <a href="/" class="wordmark" aria-label="WJS Concrete home">WJS Concrete</a>
    <div class="nav__links">
      <a href="#scope" class="nav__link">Scope</a>
      <a href="#pour-day" class="nav__link">Pour day</a>
      <a href="#quote" class="nav__link">Contact</a>
      <a href="tel:__PHONE_TEL__" class="nav__phone phone-link">__PHONE_DISPLAY__</a>
    </div>
    <a href="tel:__PHONE_TEL__" class="nav__phone phone-link" style="display:none">__PHONE_DISPLAY__</a>
  </div>
</nav>
<header class="hero" role="banner">
  <div class="reveal-cut" aria-hidden="true">
    <canvas id="hero-canvas" aria-hidden="true"></canvas>
  </div>
  <div class="container hero__inner">
    <p class="eyebrow hero__eyebrow rv"><span class="bullet"></span>CONCRETING · REDHEAD NSW</p>
    <h1 class="hero__title rv">WJS Concrete</h1>
    <p class="hero__sub rv">All aspects of concreting — Redhead based, working across the Newcastle region.</p>
    <div class="hero__cta rv">
      <a href="#quote" class="btn">Request a quote</a>
      <a href="tel:__PHONE_TEL__" class="btn btn--phone phone-link">__PHONE_DISPLAY__</a>
    </div>
  </div>
</header>
