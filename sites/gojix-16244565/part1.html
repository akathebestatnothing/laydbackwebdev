<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NEXEN Property CBR — real estate in Canberra. At NEXEN CBR, we help people move forward.">
<title>NEXEN Property CBR — Real Estate, Canberra ACT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kumbh+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ /* lbq-contrast */ --bg:#f4f4f2;--line:rgba(20,22,26,.16);--accent:#14161a;
  --enamel:#f4f4f2;
  --panel:#ffffff;
  --ink:#14161a;
  --signal:#ce2b2f;
  --concrete:#c8cbcf;
  --muted:#5c6167;
  --hair:rgba(20,22,26,.14);
  --radius:3px;
  --cap-h:14px;
}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
body{
  margin:0;
  font-family:"Kumbh Sans",system-ui,sans-serif;
  font-size:clamp(15px,1.1vw,17px);
  line-height:1.6;
  color:var(--ink);
  background:var(--enamel);
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
.js .rv{opacity:0;transform:translateY(12px);transition:opacity .6s ease,transform .6s ease}
.js .rv.on{opacity:1;transform:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* NAV */
.nav{
  position:sticky;top:0;z-index:50;
  background:var(--panel);
  border-bottom:1px solid var(--hair);
}
.nav-inner{
  max-width:1120px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.nav-plate{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--panel);
  border:1px solid var(--signal);
  border-radius:var(--radius);
  padding:6px 12px 6px 10px;
  position:relative;
}
.nav-plate:before,.nav-plate:after{
  content:"";width:6px;height:6px;background:var(--ink);
  border-radius:50%;opacity:.5;
}
.nav-plate:before{margin-right:4px}
.nav-plate:after{margin-left:4px}
.nav-plate span{
  font-family:"Bungee",cursive;font-weight:400;font-size:1.1rem;letter-spacing:.02em;
  color:var(--ink);
}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{
  font-size:.85rem;font-weight:500;letter-spacing:.02em;
  color:var(--muted);transition:color .2s;
}
.nav-links a:hover{color:var(--ink);text-decoration:none}
.nav-cta{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--ink);
  color:var(--panel);
  padding:10px 18px;
  border-radius:var(--radius);
  font-weight:600;font-size:.85rem;letter-spacing:.02em;
  border:2px solid var(--ink);
  transition:background .2s,color .2s,border-color .2s;
}
.nav-cta:hover{background:var(--panel);color:var(--ink);text-decoration:none}
@media (max-width:760px){
  .nav-links{display:none}
  .nav-cta{padding:8px 14px;font-size:.8rem}
}

/* STREET PLATE COMPONENT */
.plate{
  background:var(--panel);
  border:1px solid var(--signal);
  border-radius:var(--radius);
  position:relative;
  overflow:hidden;
}
.plate:before,.plate:after{
  content:"";position:absolute;top:10px;width:6px;height:6px;background:var(--ink);
  border-radius:50%;opacity:.45;
}
.plate:before{left:14px}
.plate:after{right:14px}
.plate-cap{
  position:absolute;top:0;left:0;right:0;height:var(--cap-h);
  background:var(--ink);
  border-bottom:1px solid var(--signal);
}
.plate-body{padding:calc(var(--cap-h) + 16px) 24px 24px}
.plate-title{
  font-family:"Bungee",cursive;font-weight:400;font-size:clamp(1.6rem,3.5vw,2.8rem);
  line-height:1.1;letter-spacing:.01em;color:var(--ink);margin:0 0 8px;
}
.plate-sub{font-size:.95rem;color:var(--muted);margin:0;line-height:1.5}

/* HERO */
.hero{
  padding:72px 20px 88px;
  display:grid;place-items:center;
}
.hero-inner{
  max-width:720px;text-align:center;
}
.hero-eyebrow{
  display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--signal);margin-bottom:16px;
}
.hero-plate{
  margin:0 auto 24px;max-width:100%;
}
.hero-plate .plate-title{font-size:clamp(2.2rem,5vw,3.8rem)}
.hero-plate .plate-body{padding-top:calc(var(--cap-h) + 28px)}
.flip-row{
  display:inline-block;perspective:400px;
  margin-top:4px;min-height:1.2em;
}
.flip-inner{
  display:inline-block;transform-origin:center bottom;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  font-family:"Bungee",cursive;font-weight:400;
  font-size:clamp(1.3rem,2.8vw,2rem);color:var(--ink);
  line-height:1.2;
}
@media (prefers-reduced-motion:reduce){
  .flip-inner{transition:none;transform:none!important}
}
.hero-sub{font-size:1.05rem;color:var(--muted);margin:20px 0 32px;max-width:560px;margin-left:auto;margin-right:auto}

/* SLOT BUTTON */
.slot-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  position:relative;
  background:transparent;border:none;cursor:pointer;
  padding:0;
}
.slot-frame{
  position:relative;
  background:linear-gradient(180deg,#1e2024 0%,#14161a 100%);
  border:1px solid var(--signal);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.25);
}
.slot-lip{
  position:absolute;top:-2px;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--signal),#e84d51,var(--signal));
}
.slot-btn .btn-label{
  position:relative;z-index:1;
  font-family:"Kumbh Sans",sans-serif;font-weight:600;font-size:.95rem;
  color:var(--panel);letter-spacing:.02em;
  padding:16px 28px;display:block;
  transition:transform .15s ease;
}
.slot-btn:hover .btn-label{transform:translateY(-1px)}
.slot-btn:active .btn-label{transform:translateY(1px)}
.slot-btn:focus-visible .slot-frame{outline:2px solid var(--signal);outline-offset:2px}

/* SECTIONS */
.section{max-width:1120px;margin:0 auto;padding:64px 20px}
.section-header{margin-bottom:40px}
.stencil-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.7rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--signal);
  margin-bottom:12px;
}
.stencil-tag:before{
  content:"";width:8px;height:8px;background:var(--signal);
  clip-path:polygon(0 50%,50% 0,100% 50%,50% 100%);
}
.section-title{
  font-family:"Kumbh Sans",sans-serif;font-weight:700;font-size:clamp(1.5rem,2.8vw,2.2rem);
  line-height:1.2;color:var(--ink);margin:0;
}

/* ABOUT BAND */
.about-band{
  background:var(--panel);
  border:1px solid var(--hair);
  border-radius:var(--radius);
  padding:40px 24px;
  text-align:center;
}
.about-lead{
  font-family:"Bungee",cursive;font-weight:400;
  font-size:clamp(1.3rem,2.5vw,1.9rem);line-height:1.3;
  color:var(--ink);margin:0 0 12px;
}
.about-sub{font-size:1rem;color:var(--muted);margin:0}

/* PLATE GRID (HOW IT WORKS) */
.plate-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start;
}
.plate-grid .plate{height:100%;display:flex;flex-direction:column}
.plate-grid .plate-body{flex:1;display:flex;flex-direction:column}
.plate-grid .plate-num{
  font-family:"Bungee",cursive;font-weight:400;font-size:1.1rem;color:var(--signal);
  margin-bottom:8px;
}
.plate-grid .plate-title{font-size:1.15rem;margin-bottom:10px}
.plate-grid .plate-desc{font-size:.9rem;color:var(--muted);margin:0;flex:1}
@media (max-width:900px){
  .plate-grid{grid-template-columns:1fr;max-width:380px;margin:0 auto}
  .plate-grid .plate:nth-child(2){transform:translateY(16px)}
  .plate-grid .plate:nth-child(3){transform:translateY(32px)}
}

/* QUOTE SECTION */
.quote-section{text-align:center}
.quote-section .section-header{margin-bottom:24px}

/* FOOTER */
.footer{
  background:var(--ink);color:var(--panel);
  padding:48px 20px 32px;
}
.footer-inner{max-width:1120px;margin:0 auto;display:grid;gap:24px}
.footer-brand{display:grid;gap:4px}
.footer-name{font-family:"Bungee",cursive;font-weight:400;font-size:1.4rem;letter-spacing:.01em}
.footer-loc{font-size:.9rem;color:var(--concrete)}
.footer-socials{display:flex;gap:16px}
.footer-socials a{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border:1px solid var(--hair);
  border-radius:50%;color:var(--concrete);
  transition:color .2s,border-color .2s,background .2s;
}
.footer-socials a:hover{color:var(--panel);border-color:var(--signal);background:rgba(255,255,255,.04);text-decoration:none}
.footer-socials svg{width:20px;height:20px}
.footer-copy{font-size:.8rem;color:var(--muted);border-top:1px solid var(--hair);padding-top:16px;margin-top:8px}

/* QUOTE FORM (injected) */
#lbq{margin-top:16px}
#lbq .lbq-fields{display:grid;gap:16px;max-width:560px;margin:0 auto}
#lbq .lbq-field{display:grid;gap:6px}
#lbq label{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#lbq input,#lbq textarea{
  width:100%;padding:14px 16px;border:1px solid var(--hair);
  background:var(--panel);color:var(--ink);
  font:inherit;border-radius:var(--radius);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
#lbq input:focus,#lbq textarea:focus{border-color:var(--signal);box-shadow:0 0 0 3px rgba(206,43,47,.12)}
#lbq textarea{min-height:120px;resize:vertical}
#lbq .lbq-submit{
  margin-top:8px;width:100%;max-width:320px;
}
#lbq .lbq-submit button{
  width:100%;padding:14px 24px;background:var(--ink);color:var(--panel);
  border:2px solid var(--ink);border-radius:var(--radius);
  font:inherit;font-weight:600;letter-spacing:.02em;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
#lbq .lbq-submit button:hover{background:var(--panel);color:var(--ink)}
#lbq .lbq-status{margin-top:12px;font-size:.9rem;color:var(--muted);min-height:1.2em}
#lbq .lbq-status.ok{color:#2e7d32}
#lbq .lbq-status.err{color:var(--signal)}

/* REDUCED MOTION */
@media (prefers-reduced-motion:reduce){
  .flip-inner{animation:none!important;transform:none!important}
  .hero-plate{transform:none!important}
}

#lbq button[type=submit]{color:#ffffff}
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
