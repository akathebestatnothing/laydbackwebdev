<script>
// Flip animation for hero plate
(function(){
  const flipEl = document.getElementById('flipText');
  if(!flipEl) return;
  
  const texts = ['PROPERTY CBR', 'REAL ESTATE', 'CANBERRA ACT'];
  let idx = 0;
  let rafId = null;
  let lastFlip = 0;
  const interval = 4500;
  
  function flip(){
    const now = performance.now();
    if(now - lastFlip < interval) return;
    lastFlip = now;
    
    idx = (idx + 1) % texts.length;
    flipEl.style.transform = 'rotateX(90deg)';
    flipEl.style.opacity = '0';
    
    setTimeout(() => {
      flipEl.textContent = texts[idx];
      flipEl.style.transform = 'rotateX(0deg)';
      flipEl.style.opacity = '1';
    }, 250);
  }
  
  function loop(t){
    flip();
    rafId = requestAnimationFrame(loop);
  }
  
  // Pointer tilt
  const heroPlate = document.querySelector('.hero-plate');
  let tiltX = 0, tiltY = 0;
  
  function onMove(e){
    if(!heroPlate) return;
    const rect = heroPlate.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    tiltX = ((e.clientY - cy) / rect.height) * 2;
    tiltY = ((e.clientX - cx) / rect.width) * -2;
    heroPlate.style.transform = `perspective(600px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
  }
  
  function onLeave(){
    tiltX = 0; tiltY = 0;
    if(heroPlate) heroPlate.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg)';
  }
  
  // Respect reduced motion
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!prefersReduced){
    heroPlate?.addEventListener('mousemove', onMove);
    heroPlate?.addEventListener('mouseleave', onLeave);
    rafId = requestAnimationFrame(loop);
  }
  
  // Cleanup on pagehide
  window.addEventListener('pagehide', () => {
    if(rafId) cancelAnimationFrame(rafId);
    heroPlate?.removeEventListener('mousemove', onMove);
    heroPlate?.removeEventListener('mouseleave', onLeave);
  });
})();

// Reveal system
(function(){
  const rv = document.querySelectorAll('.rv');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if(en.isIntersecting){
        en.target.classList.add('on');
        io.unobserve(en.target);
      }
    });
  }, {threshold: 0.12, rootMargin: '0px 0px -60px 0px'});
  rv.forEach(el => io.observe(el));
  
  // Safety net
  setTimeout(() => {
    rv.forEach(el => el.classList.add('on'));
  }, 1100);
})();
</script>
