<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Central Coast Exterior Cleaning</title>
  <!-- Wall panel - dirty surface -->
  <rect x="24" y="24" width="208" height="208" rx="8" fill="#0f1316"/>
  
  <!-- Clean path band - diagonal swipe (diamond shape centered) -->
  <path d="M128 44 L188 104 L128 164 L68 104 Z" fill="#2b7f8a"/>
  
  <!-- Water sheeting lines - vertical streaks down from the clean band -->
  <g stroke="#2b7f8a" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="92" y1="120" x2="92" y2="160"/>
    <line x1="112" y1="110" x2="112" y2="155"/>
    <line x1="128" y1="100" x2="128" y2="150"/>
    <line x1="144" y1="110" x2="144" y2="155"/>
    <line x1="164" y1="120" x2="164" y2="160"/>
  </g>
  
  <!-- Soft-wash nozzle fan - subtle arc at top of clean band -->
  <g stroke="#2b7f8a" stroke-width="1.5" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M100 110 Q128 90 156 110"/>
    <path d="M110 115 Q128 100 146 115"/>
  </g>
  
  <!-- Clean-to-dirty edge - sharp horizontal line across the diamond center -->
  <line x1="68" y1="104" x2="188" y2="104" stroke="#2b7f8a" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>