<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" id="logo">
  <title>John Watson Earthworks logo</title>
  <!-- Strata column mark - vertical core sample with JW monogram integrated -->
  <!-- All solid fills, clean 0/45/90 degree angles only -->
  
  <!-- Main column - centered horizontally -->
  <g fill="#55907A">
    <!-- Column background shape - 80 to 176 = 96 wide, centered at 128 -->
    <rect x="80" y="24" width="96" height="208" rx="4"/>
    
    <!-- Strata division lines (horizontal, clean) -->
    <rect x="80" y="64" width="96" height="4" fill="#221B14"/>
    <rect x="80" y="112" width="96" height="4" fill="#221B14"/>
    <rect x="80" y="152" width="96" height="4" fill="#221B14"/>
    <rect x="80" y="184" width="96" height="4" fill="#221B14"/>
    
    <!-- Topsoil texture - larger speckles -->
    <circle cx="100" cy="40" r="5" fill="#221B14"/>
    <circle cx="136" cy="36" r="5" fill="#221B14"/>
    <circle cx="160" cy="44" r="5" fill="#221B14"/>
    <circle cx="108" cy="52" r="5" fill="#221B14"/>
    <circle cx="148" cy="48" r="5" fill="#221B14"/>
    
    <!-- Gravel texture - larger pellets -->
    <circle cx="104" cy="88" r="6" fill="#221B14"/>
    <circle cx="140" cy="92" r="6" fill="#221B14"/>
    <circle cx="116" cy="100" r="6" fill="#221B14"/>
    <circle cx="152" cy="96" r="6" fill="#221B14"/>
    
    <!-- Sand texture - horizontal dashes as rects (clean 0°) -->
    <rect x="92" y="124" width="28" height="4" fill="#221B14"/>
    <rect x="136" y="130" width="28" height="4" fill="#221B14"/>
    <rect x="100" y="136" width="28" height="4" fill="#221B14"/>
    <rect x="132" y="142" width="28" height="4" fill="#221B14"/>
    
    <!-- Rock texture - horizontal lines (clean 0°) -->
    <rect x="88" y="158" width="80" height="3" fill="#221B14"/>
    <rect x="88" y="166" width="80" height="3" fill="#221B14"/>
    <rect x="88" y="174" width="80" height="3" fill="#221B14"/>
    <rect x="88" y="182" width="80" height="3" fill="#221B14"/>
    <rect x="88" y="190" width="80" height="3" fill="#221B14"/>
    <rect x="88" y="198" width="80" height="3" fill="#221B14"/>
    <rect x="88" y="206" width="80" height="3" fill="#221B14"/>
  </g>
  
  <!-- Excavator bucket silhouette at top - solid bone color -->
  <g fill="#ECE3D3">
    <!-- Bucket shape - clean angles -->
    <path d="M112 16 L100 28 L100 40 Q100 44 104 44 L140 44 Q144 44 144 40 L144 28 Z"/>
    <path d="M104 44 L112 52 L140 52 L132 44 Z"/>
  </g>
  
  <!-- JW Monogram at center of column - solid bone, filled paths, clean angles -->
  <g fill="#ECE3D3">
    <!-- J as filled shape - vertical with horizontal base and hook -->
    <rect x="114" y="136" width="6" height="28"/>  <!-- vertical stem -->
    <rect x="114" y="164" width="12" height="6"/>  <!-- base -->
    <rect x="108" y="158" width="6" height="12"/>  <!-- hook left -->
    
    <!-- W as filled shape - two V's at clean 45 degrees -->
    <!-- First V: left peak at 130,136; bottom at 136,164; right peak at 142,136 -->
    <path d="M130 164 L136 136 L142 164 L136 152 Z"/>
    <!-- Second V: left peak at 142,136; bottom at 148,164; right peak at 154,136 -->
    <path d="M142 164 L148 136 L154 164 L148 152 Z"/>
    <!-- Connect the bottoms -->
    <rect x="136" y="164" width="12" height="6"/>
  </g>
  
  <!-- Depth ticks on left - solid verdigris -->
  <g fill="#55907A">
    <rect x="64" y="24" width="12" height="4"/>
    <rect x="64" y="72" width="12" height="4"/>
    <rect x="64" y="120" width="12" height="4"/>
    <rect x="64" y="168" width="12" height="4"/>
    <rect x="64" y="216" width="12" height="4"/>
  </g>
  
  <!-- Side annotation marks - solid bone -->
  <rect x="184" y="68" width="16" height="6" rx="1" fill="#ECE3D3"/>
  <rect x="184" y="116" width="16" height="6" rx="1" fill="#ECE3D3"/>
  <rect x="184" y="164" width="16" height="6" rx="1" fill="#ECE3D3"/>
</svg>
