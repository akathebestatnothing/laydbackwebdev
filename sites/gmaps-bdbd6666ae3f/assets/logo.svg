<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" id="logo">
  <!-- Diamond saw blade - outer rim -->
  <circle cx="128" cy="128" r="96" stroke="#0e0f11" stroke-width="6" fill="none"/>
  <!-- Diamond segments on blade -->
  <g stroke="#0e0f11" stroke-width="4" fill="none">
    <line x1="128" y1="40" x2="128" y2="56"/>
    <line x1="128" y1="200" x2="128" y2="216"/>
    <line x1="40" y1="128" x2="56" y2="128"/>
    <line x1="200" y1="128" x2="216" y2="128"/>
    <line x1="64.7" y1="64.7" x2="76.5" y2="76.5"/>
    <line x1="179.5" y1="179.5" x2="191.3" y2="191.3"/>
    <line x1="64.7" y1="191.3" x2="76.5" y2="179.5"/>
    <line x1="179.5" y1="76.5" x2="191.3" y2="64.7"/>
  </g>
  <!-- Blade center hole -->
  <circle cx="128" cy="128" r="18" stroke="#0e0f11" stroke-width="3" fill="none"/>
  <!-- Kerf groove - the cut line running toward viewer -->
  <path d="M128 144 L128 232" stroke="#0e0f11" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Concrete slab section -->
  <rect x="72" y="152" width="112" height="96" rx="4" stroke="#0e0f11" stroke-width="3" fill="none"/>
  <!-- Chalk line with blade-depth tick -->
  <path d="M72 184 L200 184" stroke="#787878" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <path d="M128 176 L128 192" stroke="#787878" stroke-width="3" fill="none"/>
  <!-- Water slurry spray marks -->
  <g stroke="#787878" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M110 100 Q105 90 95 95"/>
    <path d="M146 100 Q151 90 161 95"/>
    <path d="M105 115 Q100 110 92 118"/>
    <path d="M151 115 Q156 110 164 118"/>
    <path d="M118 92 Q115 85 108 82"/>
    <path d="M138 92 Q141 85 148 82"/>
  </g>
</svg>