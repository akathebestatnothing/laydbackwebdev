  <style>
    :root {
      --quarry: #26201a;
      --sand: #f2ead9;
      --chisel: #d9c8a6;
      --ironbark: #4a3c2c;
      --ochre: #d9a84a;
      --bg: var(--quarry);
      --line: rgba(242,234,217,0.18);
      --accent: var(--ochre);
      --text-on-quarry: var(--chisel);
      --text-on-sand: var(--quarry);
      --text-muted-quarry: rgba(242,234,217,0.7);
      --text-muted-sand: rgba(38,32,26,0.7);
      --font-display: 'Besley', Georgia, serif;
      --font-body: 'Mozilla Text', system-ui, sans-serif;
      --font-mono: 'Cutive Mono', monospace;
      --nav-h: 56px;
      --max-w: 1120px;
      --space-1: clamp(0.5rem, 1.2vw, 0.75rem);
      --space-2: clamp(1rem, 2.4vw, 1.5rem);
      --space-3: clamp(1.5rem, 3.6vw, 2.25rem);
      --space-4: clamp(2rem, 4.8vw, 3rem);
      --space-5: clamp(3rem, 7.2vw, 4.5rem);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      font-family: var(--font-body);
      font-size: clamp(1rem, 0.95rem + 0.3vw, 1.125rem);
      line-height: 1.65;
      color: var(--text-on-quarry);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .rv { opacity: 0; transform: translateY(12px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .rv.on { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }
    .no-js .rv { opacity: 1; transform: none; }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--ochre); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .container { width: 100%; max-width: var(--max-w); margin: 0 auto; padding: 0 var(--space-2); }
