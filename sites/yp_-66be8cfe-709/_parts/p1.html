<style>
:root {
  --ink: #1a1a2e;
  --ink-2: #3d3d5c;
  --chalk: #f5f5f0;
  --chalk-2: #e8e8e0;
  --tape: #e8c547;
  --tape-2: #d4b03d;
  --bg: #f5f5f0;
  --bg-2: #ebe8e0;
  --line: rgba(26,26,46,.12);
  --line-acc: rgba(232,197,71,.35);
  --panel: #fff;
  --nav-h: 64px;
  --font-d: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
  --font-m: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
section[id],footer[id]{scroll-margin-top:calc(var(--nav-h) + 10px)}
html:not(.js) .rv{opacity:1!important;transform:none!important}
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.js .rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--tape);outline-offset:3px}
.skip{position:absolute;top:-100%;left:50%;transform:translateX(-50%);padding:.7rem 1.2rem;background:var(--ink);color:#fff;font-weight:700;z-index:10000}
.skip:focus{top:1rem}
