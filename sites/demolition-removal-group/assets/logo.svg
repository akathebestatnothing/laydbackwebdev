<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Plate background -->
  <rect x="0" y="0" width="320" height="180" fill="#F5F5F5"/>
  
  <!-- DRG Monogram - slanted ~18deg -->
  <g transform="translate(160, 70) skewX(18)">
    <!-- D -->
    <text x="-115" y="0" font-family="Saira Condensed, sans-serif" font-weight="700" font-size="72" fill="#212121" text-anchor="middle" dominant-baseline="central" letter-spacing="0">D</text>
    <!-- R in orange -->
    <text x="0" y="0" font-family="Saira Condensed, sans-serif" font-weight="700" font-size="72" fill="#E65100" text-anchor="middle" dominant-baseline="central" letter-spacing="0">R</text>
    <!-- G -->
    <text x="115" y="0" font-family="Saira Condensed, sans-serif" font-weight="700" font-size="72" fill="#212121" text-anchor="middle" dominant-baseline="central" letter-spacing="0">G</text>
  </g>
  
  <!-- Thin orange rule under monogram -->
  <line x1="55" y1="112" x2="265" y2="112" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Tagline -->
  <text x="160" y="138" font-family="Saira Condensed, sans-serif" font-weight="400" font-size="18" fill="#212121" text-anchor="middle" dominant-baseline="central" letter-spacing="4">DEMOLITION REMOVAL GROUP</text>
  
  <!-- Thin dark rule beneath tagline -->
  <line x1="55" y1="155" x2="265" y2="155" stroke="#212121" stroke-width="1" stroke-linecap="round"/>
</svg>