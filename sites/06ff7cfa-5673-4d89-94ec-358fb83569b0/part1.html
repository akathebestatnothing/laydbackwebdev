<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Young Plumbing — plumbing services in Cardiff and Lake Macquarie, NSW. Blocked drains, hot water, leaks, renovations and maintenance.">
  <title>Young Plumbing — plumber in Cardiff · Lake Macquarie, NSW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700;800&family=Libre+Franklin:wght@400;500;600&family=Victor+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --field:#eef1f2;
      --panel:#ffffff;
      --ink:#14212b;
      --muted:#5d6b74;
      --col-prim:#2c5d7c;
      --col-deep:#16394f;
      --accent:#3f88a8;
      --hair:rgba(20,33,43,.14);
      --font-display:'Darker Grotesque',sans-serif;
      --font-body:'Libre Franklin',sans-serif;
      --font-label:'Victor Mono',monospace;
      --maxw:1200px;
      --nav-h:64px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *, *::before, *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
    body{
      font-family:var(--font-body);
      background:var(--field);
      color:var(--ink);
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    .js .rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
    .js .rv.on{opacity:1;transform:none}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;height:auto;display:block}
    ul{list-style:none}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
      padding:.875rem 1.5rem;border-radius:999px;font:600 1rem/1 var(--font-body);
      border:2px solid var(--col-prim);background:transparent;color:var(--col-prim);
      transition:background .2s ease,color .2s ease,border-color .2s ease;
    }
    .btn:hover{background:var(--col-prim);color:#fff}
    .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .btn.ghost{border-color:var(--ink);color:var(--ink)}
    .btn.ghost:hover{background:var(--ink);color:#fff}
    .pill{
      display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;
      border:2px solid var(--col-prim);border-radius:999px;
      font:500 .875rem/1 var(--font-body);color:var(--col-prim);
      transition:background .2s ease,color .2s ease;
    }
    .pill:hover{background:var(--col-prim);color:#fff}
    .pill:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .logo{
      font:700 clamp(1.25rem,3vw,1.75rem)/1 var(--font-display);
      letter-spacing:-.02em;color:var(--ink);
    }
    .logo img{height:40px;width:auto;display:block}
    @media (max-width:599px){
      .logo img{height:36px}
    }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .burger { display: flex !important; }
    }
    @media (min-width: 769px) {
      .mobile-menu { display: none !important; }
    }
  </style>
</head>
<body>
  <nav class="nav rv" role="navigation" aria-label="Main navigation">
    <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:var(--nav-h)">
      <a href="#" class="logo" aria-label="Young Plumbing home">
        <img src="assets/logo.jpg" alt="" aria-hidden="true" loading="lazy">
      </a>
      <div class="nav-links" style="display:flex;align-items:center;gap:2rem">
        <a href="#services" style="font:500 .9375rem/1 var(--font-body);color:var(--muted);transition:color .2s">Services</a>
        <a href="#process" style="font:500 .9375rem/1 var(--font-body);color:var(--muted);transition:color .2s">Process</a>
        <a href="#areas" style="font:500 .9375rem/1 var(--font-body);color:var(--muted);transition:color .2s">Areas</a>
        <a href="#contact" style="font:500 .9375rem/1 var(--font-body);color:var(--muted);transition:color .2s">Contact</a>
      </div>
      <a href="tel:__PHONE_TEL__" class="pill" aria-label="Call Young Plumbing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>__PHONE_DISPLAY__</span>
      </a>
      <button class="burger" aria-expanded="false" aria-controls="mobile-menu" aria-label="Toggle menu" style="display:none;background:none;border:none;padding:.5rem;cursor:pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div id="mobile-menu" class="mobile-menu" style="display:none;padding:1rem 24px;border-top:1px solid var(--hair)">
      <a href="#services" style="display:block;padding:.75rem 0;font:500 1rem/1 var(--font-body);color:var(--ink);border-bottom:1px solid var(--hair)">Services</a>
      <a href="#process" style="display:block;padding:.75rem 0;font:500 1rem/1 var(--font-body);color:var(--ink);border-bottom:1px solid var(--hair)">Process</a>
      <a href="#areas" style="display:block;padding:.75rem 0;font:500 1rem/1 var(--font-body);color:var(--ink);border-bottom:1px solid var(--hair)">Areas</a>
      <a href="#contact" style="display:block;padding:.75rem 0;font:500 1rem/1 var(--font-body);color:var(--ink);border-bottom:1px solid var(--hair)">Contact</a>
      <a href="tel:__PHONE_TEL__" class="pill" style="display:inline-flex;margin-top:1rem;width:100%;justify-content:center">Call __PHONE_DISPLAY__</a>
    </div>
  </nav>
