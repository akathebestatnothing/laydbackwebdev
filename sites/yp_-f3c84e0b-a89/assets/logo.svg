<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Aspect Excavations logo - tight-access excavation concept -->
  <!-- A mini excavator arm reaching through a narrow passage (two parallel lines) -->
  <!-- Brand hue: hi-vis chartreuse #a8e600 -->
  
  <defs>
    <style>
      .brand { fill: none; stroke: #a8e600; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .brand-fill { fill: #a8e600; }
    </style>
  </defs>
  
  <!-- Passage boundaries - two parallel vertical lines suggesting tight access -->
  <path class="brand" d="M72 40 L72 216" />
  <path class="brand" d="M184 40 L184 216" />
  
  <!-- Mini excavator simplified - boom, arm, bucket reaching between the lines -->
  <!-- Boom -->
  <path class="brand" d="M128 56 L128 112" />
  <!-- Arm -->
  <path class="brand" d="M128 112 L152 152" />
  <!-- Bucket -->
  <path class="brand-fill" d="M152 152 L176 140 L176 164 L152 176 Z" />
  
  <!-- Tracks/base of mini excavator -->
  <path class="brand" d="M96 192 L160 192" />
  <path class="brand" d="M96 192 L96 208" />
  <path class="brand" d="M160 192 L160 208" />
  <path class="brand" d="M112 192 L112 208" />
  <path class="brand" d="M144 192 L144 208" />
  
  <!-- Dimension line with arrowheads - clearance indicator -->
  <path class="brand" d="M72 232 L184 232" stroke-width="4" />
  <!-- Left arrowhead -->
  <path class="brand-fill" d="M72 224 L80 232 L72 240 Z" />
  <!-- Right arrowhead -->
  <path class="brand-fill" d="M184 224 L176 232 L184 240 Z" />
  
  <!-- Small utility/tree mark on left side -->
  <circle class="brand" cx="44" cy="128" r="12" stroke-width="4" />
  <path class="brand" d="M44 116 L44 100" stroke-width="4" />
  <path class="brand" d="M44 100 L36 92" stroke-width="3" />
  <path class="brand" d="M44 100 L52 92" stroke-width="3" />
</svg>