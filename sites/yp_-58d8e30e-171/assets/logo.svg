<svg viewBox="0 0 384 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 808 Excavation Logo - Pipe geometry forming 808 numerals -->
  <!-- Copper brand color #c76b3f on transparent -->
  
  <defs>
    <style>
      .pipe { stroke: #c76b3f; stroke-width: 18; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .mist { fill: #e9eef2; }
    </style>
  </defs>
  
  <!-- Left 8: upper loop -->
  <path class="pipe" d="M48 72 C48 50 64 34 86 34 C108 34 124 50 124 72 C124 94 108 110 86 110 C64 110 48 94 48 72 Z"/>
  <!-- Left 8: lower loop -->
  <path class="pipe" d="M48 144 C48 122 64 106 86 106 C108 106 124 122 124 144 C124 166 108 182 86 182 C64 182 48 166 48 144 Z"/>
  <!-- Connecting pipe between loops (the vertical stroke of 8) -->
  <path class="pipe" d="M86 72 V144"/>
  
  <!-- Middle 0: single loop (pipe circle) -->
  <path class="pipe" d="M176 108 C176 80 198 58 226 58 C254 58 276 80 276 108 C276 136 254 158 226 158 C198 158 176 136 176 108 Z"/>
  
  <!-- Right 8: upper loop -->
  <path class="pipe" d="M288 72 C288 50 304 34 326 34 C348 34 364 50 364 72 C364 94 348 110 326 110 C304 110 288 94 288 72 Z"/>
  <!-- Right 8: lower loop -->
  <path class="pipe" d="M288 144 C288 122 304 106 326 106 C348 106 364 122 364 144 C364 166 348 182 326 182 C304 182 288 166 288 144 Z"/>
  <!-- Connecting pipe between loops -->
  <path class="pipe" d="M326 72 V144"/>
  
  <!-- Junction nodes at key connection points (copper dots) -->
  <circle class="mist" cx="86" cy="72" r="5"/>
  <circle class="mist" cx="86" cy="110" r="5"/>
  <circle class="mist" cx="86" cy="144" r="5"/>
  <circle class="mist" cx="226" cy="108" r="5"/>
  <circle class="mist" cx="326" cy="72" r="5"/>
  <circle class="mist" cx="326" cy="110" r="5"/>
  <circle class="mist" cx="326" cy="144" r="5"/>
</svg>