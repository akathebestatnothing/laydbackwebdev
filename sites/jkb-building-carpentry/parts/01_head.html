<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JKB Building & Carpentry — Newcastle NSW</title>
<meta name="description" content="JKB Building & Carpentry — bathrooms, flooring, decks & pergolas, extensions, kitchen installs, doors & windows, cladding, property maintenance. Newcastle & surrounds.">
<link rel="preload" as="image" href="assets/logo.jpg">
<style>
:root{
  --bg:#1d2a22;
  --bg-alt:#f3ead9;
  --ink:#f3ead9;
  --ink-alt:#1d2a22;
  --accent:#e8b23a;
  --line:rgba(243,234,217,0.18);
  --line-alt:rgba(29,42,34,0.22);
  --radius:0;
  --font-display:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --fs-hero:clamp(2.8rem,6vw,5.5rem);
  --fs-h2:clamp(1.6rem,3.5vw,2.6rem);
  --fs-body:clamp(1rem,1.1vw,1.125rem);
  --fs-mono:0.75rem;
  --space:clamp(1.5rem,3vw,3rem);
  --space-lg:clamp(3rem,6vw,6rem);
  --maxw:72ch;
  --nav-h:56px;
}
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
}
html{scroll-behavior:smooth}
html:not(.js) .rv{opacity:1!important;transform:none!important}
.js .rv{opacity:0;transform:translateY(24px);transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.7s cubic-bezier(0.16,1,0.3,1)}
.js .rv.on{opacity:1;transform:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-display);font-size:var(--fs-body);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;top:-100%;left:50%;transform:translateX(-50%);padding:0.75rem 1.25rem;background:var(--accent);color:#1d2a22;font-weight:700;z-index:10000;border-radius:0}
.skip:focus{top:1rem}
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,3vw,2.5rem);background:rgba(29,42,34,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:1000}
.nav__brand{display:flex;align-items:center;gap:0.75rem;font-weight:700;font-size:clamp(1rem,2vw,1.25rem);letter-spacing:0.02em}
.nav__brand img{height:36px;width:auto;display:block}
.nav__links{display:flex;gap:clamp(1rem,2.5vw,2rem);list-style:none;margin:0;padding:0}
.nav__links a{font-size:var(--fs-mono);text-transform:uppercase;letter-spacing:0.12em;opacity:0.8;transition:opacity 0.2s}
.nav__links a:hover{opacity:1}
.nav__cta{display:flex;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.7rem 1.4rem;font-size:var(--fs-mono);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;border:0;border-radius:0;cursor:pointer;transition:background 0.2s,color 0.2s}
.btn--primary{background:var(--accent);color:#1d2a22}
.btn--primary:hover{background:#d4a033}
.btn--outline{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn--outline:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
