<script>
// Batten Wave 3D Hero — original motion per ORDER.md
// rAF-first-frame, isFinite guards, pointer sentinel, reduced-motion static frame

(() => {
  const canvas = document.getElementById('heroCanvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  let width = 0, height = 0, dpr = 1;
  let mouseX = -9999, mouseY = -9999;
  let rafId = 0;
  let prefersReduced = false;
  
  // Batten wave parameters
  const BATTEN_COUNT = 32;
  const BATTEN_WIDTH = 0.018; // as fraction of width
  const PERSPECTIVE = 1.15;
  const HORIZON_Y = 0.54;
  const CAM_H = 1.35;
  const Z_NEAR = 0.9;
  const Z_FAR = 30;
  const WAVE_SPEED = 2600; // ms per cycle
  const WAVE_AMPLITUDE = 0.5;
  const SHEEN_ALPHA = 0.08;
  
  // Batten state
  const battens = [];
  
  function initBattens() {
    battens.length = 0;
    for (let i = 0; i < BATTEN_COUNT; i++) {
      const x = (i / (BATTEN_COUNT - 1)) * 2 - 1; // -1 to 1
      const baseHeight = 0.6 + Math.random() * 0.8; // 0.6 to 1.4
      const phase = Math.random() * Math.PI * 2;
      battens.push({ x, baseHeight, phase, currentHeight: baseHeight });
    }
  }
  
  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    width = Math.round(rect.width * dpr);
    height = Math.round(rect.height * dpr);
    canvas.width = width;
    canvas.height = height;
    // CSS handles layout sizing; we only set device pixels
  }
  
  function project(x, z) {
    // Floor projection: camera above floor looking down
    // s = f/z; x = W/2 + x*s; y = horizon + camH*f/z
    const f = PERSPECTIVE * height;
    const s = f / z;
    const px = width * 0.5 + x * s;
    const py = height * HORIZON_Y + CAM_H * f / z;
    return { x: px, y: py, scale: s };
  }
  
  function drawBatten(b, time) {
    // Batten wave animation: staggered heights assembling
    const wavePhase = (time / WAVE_SPEED) * Math.PI * 2;
    const stagger = b.phase;
    const wave = Math.sin(wavePhase + stagger) * WAVE_AMPLITUDE;
    b.currentHeight = b.baseHeight + wave * 0.3;
    
    // Only draw if batten is in view
    const zBase = Z_NEAR;
    const zTop = Z_NEAR + b.currentHeight * (Z_FAR - Z_NEAR) * 0.15;
    
    const pBase = project(b.x * 0.85, zBase);
    const pTop = project(b.x * 0.85, zTop);
    
    const battenW = Math.max(1, BATTEN_WIDTH * pBase.scale);
    
    // Batten body - forest green with subtle variation
    const grad = ctx.createLinearGradient(pBase.x - battenW/2, pBase.y, pBase.x + battenW/2, pBase.y);
    grad.addColorStop(0, '#1a3020');
    grad.addColorStop(0.5, '#254030');
    grad.addColorStop(1, '#1a3020');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(pBase.x - battenW/2, pBase.y);
    ctx.lineTo(pTop.x - battenW/2 * (pTop.scale/pBase.scale), pTop.y);
    ctx.lineTo(pTop.x + battenW/2 * (pTop.scale/pBase.scale), pTop.y);
    ctx.lineTo(pBase.x + battenW/2, pBase.y);
    ctx.closePath();
    ctx.fill();
    
    // Subtle highlight on left edge (light direction)
    ctx.strokeStyle = 'rgba(243,234,217,0.06)';
    ctx.lineWidth = Math.max(0.5, battenW * 0.15);
    ctx.beginPath();
    ctx.moveTo(pBase.x - battenW/2, pBase.y);
    ctx.lineTo(pTop.x - battenW/2 * (pTop.scale/pBase.scale), pTop.y);
    ctx.stroke();
  }
  
  function drawSheen(time) {
    // Slow sheen line across the wall
    const wavePhase = (time / WAVE_SPEED) * Math.PI * 2;
    const sheenZ = Z_NEAR + 2.2 + (Math.sin(wavePhase) * 0.5 + 0.5) * 26;
    const pSheen = project(0, sheenZ);
    
    const grad = ctx.createLinearGradient(0, pSheen.y - 2, 0, pSheen.y + 2);
    grad.addColorStop(0, 'rgba(243,234,217,0)');
    grad.addColorStop(0.5, 'rgba(232,178,58,0.12)');
    grad.addColorStop(1, 'rgba(243,234,217,0)');
    
    ctx.fillStyle = grad;
    ctx.fillRect(0, pSheen.y - 2, width, 4);
  }
  
  function drawPointerEffect() {
    // Pointer sentinel: only apply when mouse is in reasonable range
    if (mouseX > -100 && mouseX < width + 100 && mouseY > -100 && mouseY < height + 100) {
      // Subtle parallax on battens based on pointer
      // This is handled in drawBatten via global mouseX/mouseY if needed
    }
  }
  
  function animate(ts) {
    if (!isFinite(ts)) {
      rafId = requestAnimationFrame(animate);
      return;
    }
    
    ctx.clearRect(0, 0, width, height);
    
    // Draw battens back to front (farther first)
    const sorted = [...battens].sort((a,b) => b.currentHeight - a.currentHeight);
    for (const b of sorted) {
      drawBatten(b, ts);
    }
    
    // Draw sheen
    drawSheen(ts);
    
    rafId = requestAnimationFrame(animate);
  }
  
  function drawStaticFrame() {
    // Reduced-motion: single static frame
    ctx.clearRect(0, 0, width, height);
    for (const b of battens) {
      // Draw at rest position
      const zBase = Z_NEAR;
      const zTop = Z_NEAR + b.baseHeight * (Z_FAR - Z_NEAR) * 0.15;
      const pBase = project(b.x * 0.85, zBase);
      const pTop = project(b.x * 0.85, zTop);
      const battenW = Math.max(1, BATTEN_WIDTH * pBase.scale);
      
      const grad = ctx.createLinearGradient(pBase.x - battenW/2, pBase.y, pBase.x + battenW/2, pBase.y);
      grad.addColorStop(0, '#1a3020');
      grad.addColorStop(0.5, '#254030');
      grad.addColorStop(1, '#1a3020');
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(pBase.x - battenW/2, pBase.y);
      ctx.lineTo(pTop.x - battenW/2 * (pTop.scale/pBase.scale), pTop.y);
      ctx.lineTo(pTop.x + battenW/2 * (pTop.scale/pBase.scale), pTop.y);
      ctx.lineTo(pBase.x + battenW/2, pBase.y);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = 'rgba(243,234,217,0.06)';
      ctx.lineWidth = Math.max(0.5, battenW * 0.15);
      ctx.beginPath();
      ctx.moveTo(pBase.x - battenW/2, pBase.y);
      ctx.lineTo(pTop.x - battenW/2 * (pTop.scale/pBase.scale), pTop.y);
      ctx.stroke();
    }
    // Static sheen
    const pSheen = project(0, Z_NEAR + 15);
    const grad = ctx.createLinearGradient(0, pSheen.y - 2, 0, pSheen.y + 2);
    grad.addColorStop(0, 'rgba(243,234,217,0)');
    grad.addColorStop(0.5, 'rgba(232,178,58,0.08)');
    grad.addColorStop(1, 'rgba(243,234,217,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, pSheen.y - 2, width, 4);
  }
  
  function onMouseMove(e) {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * dpr;
    mouseY = (e.clientY - rect.top) * dpr;
  }
  
  function onMouseLeave() {
    mouseX = -9999;
    mouseY = -9999;
  }
  
  function checkReducedMotion() {
    prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
      cancelAnimationFrame(rafId);
      drawStaticFrame();
    } else {
      initBattens();
      rafId = requestAnimationFrame(animate);
    }
  }
  
  // Initialize
  function init() {
    resize();
    initBattens();
    checkReducedMotion();
    
    window.addEventListener('resize', () => {
      resize();
      if (prefersReduced) drawStaticFrame();
    });
    
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseleave', onMouseLeave);
    
    // Listen for reduced-motion changes
    window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', checkReducedMotion);
  }
  
  // Safety net: if JS loads but rAF doesn't fire in ~1100ms, draw static
  setTimeout(() => {
    if (rafId === 0 && !prefersReduced) {
      drawStaticFrame();
    }
  }, 1100);
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

// Reveal on scroll (IntersectionObserver)
(() => {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('on');
        obs.unobserve(e.target);
      }
    });
  }, {rootMargin: '0px 0px -10% 0px', threshold: 0.1});
  
  document.querySelectorAll('.rv').forEach(el => obs.observe(el));
  
  // Safety net: reveal all after ~1100ms
  setTimeout(() => {
    document.querySelectorAll('.rv:not(.on)').forEach(el => el.classList.add('on'));
  }, 1100);
})();

// Year in footer
document.getElementById('year').textContent = new Date().getFullYear();

// Mark JS as loaded for no-JS fallback
document.documentElement.classList.add('js');
</script>
</body>
</html>
